name: CI - Build debug test APK

# CI-only non-production build. It may create a workflow-run artifact.
# It must never publish or replace a GitHub Release.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-test-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install locked dependencies
        run: npm ci

      - name: Run release-containment policy
        run: node --test tests/release-workflow-policy.test.mjs

      - name: Add generated Android platform
        run: npm run add:android

      - name: Patch Android project for debug compatibility
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/d' "$MF" || true

      - name: Sync web assets into Android project
        run: npm run sync

      - name: Apply tracked Android overrides
        run: node build-overrides/apply-overrides.js

      - name: Prepare API-23-compatible assets
        run: npm run prepare:api23

      - name: Build debug test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename debug test APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "out/SaagarControlCentre-DEBUG-TEST-${GITHUB_SHA:0:12}.apk"
          ls -lh out

      - name: Upload debug test APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: SaagarControlCentre-DEBUG-TEST-${{ github.sha }}
          path: out/SaagarControlCentre-DEBUG-TEST-*.apk
          if-no-files-found: error
          retention-days: 14
