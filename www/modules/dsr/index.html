<style>
/* ─────────────────────────────────────────
   TOKENS
───────────────────────────────────────── */
/* ── SHARED DESIGN-SYSTEM TOKENS (canonical) ──
   This module's previously forked navy/gold palette has been replaced by the
   shared token system below. The module's original semantic variable names
   (--accent, --white, --muted, --border, --r, …) are kept as thin ALIASES that
   point at the canonical tokens, so all existing `var(--…)` references resolve
   to the design system with zero markup/logic churn. */
:root{
  --navy:#0d2340; --navy-mid:#1a3a5c; --navy-light:#264d7a;
  --gold:#b8922a; --gold-light:#d4a843; --gold-pale:#fdf6e3;
  --cream:#faf8f3; --paper:#ffffff;
  --red:#b91c1c; --red-pale:#fef2f2; --amber:#b45309; --amber-pale:#fffbeb;
  --green:#166534; --green-pale:#f0fdf4; --blue:#1d4ed8; --blue-pale:#eff6ff;
  --gray-50:#fafafa; --gray-100:#f4f4f5; --gray-200:#e4e4e7; --gray-300:#d4d4d8;
  --gray-400:#a1a1aa; --gray-500:#71717a; --gray-600:#52525b; --gray-700:#3f3f46; --gray-800:#27272a;
  --radius:12px; --radius-lg:16px;
  --font-sans:'DM Sans',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --font-serif:'DM Serif Display',Georgia,'Times New Roman',serif;
}

:root {
  /* ── Aliases → canonical tokens (keeps existing references working) ── */
  /* Ink / neutrals */
  --ink:        var(--gray-800);
  --ink-2:      var(--gray-700);
  --ink-3:      var(--gray-700);
  --muted:      var(--gray-500);
  --subtle:     var(--gray-400);
  --border:     var(--gray-200);
  --border-2:   var(--gray-100);
  --surface:    var(--gray-50);
  --white:      var(--paper);

  /* Accent — navy + gold (shared brand) */
  --accent:     var(--navy);
  --accent-2:   var(--navy-mid);
  --accent-3:   var(--navy-light);
  --gold-lt:    var(--gold-light);
  /* --gold and --gold-pale come straight from the canonical tokens above */

  /* Semantic */
  --green-mid:  #86efac;
  --amber-mid:  #fcd34d;
  --red-mid:    #fca5a5;
  --sky:        var(--blue);
  --sky-pale:   var(--blue-pale);

  /* Radius (mapped onto the shared --radius scale) */
  --r-xs: 6px;
  --r-sm: 10px;
  --r:    var(--radius);
  --r-lg: var(--radius-lg);
  --r-xl: 28px;

  /* Mono stack for clocks / timestamps (kept; serif reserved for display) */
  --font-mono: 'DM Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;

  /* Shadow */
  --sh-xs: 0 1px 3px rgba(10,10,31,.06), 0 1px 2px rgba(10,10,31,.04);
  --sh-sm: 0 2px 8px rgba(10,10,31,.08), 0 1px 3px rgba(10,10,31,.05);
  --sh-md: 0 8px 24px rgba(10,10,31,.10), 0 2px 6px rgba(10,10,31,.06);
  --sh-lg: 0 20px 48px rgba(10,10,31,.14), 0 4px 12px rgba(10,10,31,.08);
}

/* ─────────────────────────────────────────
   RESET & BASE
───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; height: 100%; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
input, select, textarea, button { font-family: inherit; }
img { display: block; }

/* ─────────────────────────────────────────
   SCREENS
───────────────────────────────────────── */
.screen { display: none; min-height: 100dvh; flex-direction: column; }
.screen.active { display: flex; }

/* ══════════════════════════════════════
   LOGIN
══════════════════════════════════════ */
#scr-login {
  background: var(--accent);
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(184,146,42,.18) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 80% 80%, rgba(38,77,122,.5) 0%, transparent 60%);
  align-items: center;
  justify-content: center;
  padding: 20px;
  min-height: 100dvh;
}
.login-wrap {
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.login-brand {
  text-align: center;
  padding: 0 0 32px;
}
.login-mark {
  width: 64px; height: 64px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-lt) 100%);
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 8px 32px rgba(184,146,42,.35);
}
.login-mark svg { width: 32px; height: 32px; color: var(--navy); }
.login-brand h1 {
  font-family: var(--font-serif);
  font-size: 24px; font-weight: 400; color: var(--white);
  letter-spacing: -.3px; line-height: 1.2;
}
.login-brand .brand-sub {
  font-size: 13px; color: rgba(255,255,255,.45); margin-top: 4px; font-weight: 400;
}

.login-card {
  background: rgba(255,255,255,.06);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--r-xl);
  padding: 28px 24px;
  box-shadow: var(--sh-lg);
}
.login-date-pill {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.10);
  border-radius: 99px;
  padding: 7px 16px;
  font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,.7);
  margin-bottom: 22px;
}
.login-date-pill span { color: var(--gold); font-weight: 600; }

/* Role switcher */
.role-sw {
  display: grid; grid-template-columns: 1fr 1fr;
  background: rgba(0,0,0,.25);
  border-radius: var(--r-sm);
  padding: 3px;
  gap: 3px;
  margin-bottom: 22px;
}
.role-sw-btn {
  padding: 10px 6px;
  border: none; background: transparent; cursor: pointer;
  border-radius: 8px;
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,.45);
  transition: all .2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.role-sw-btn.active {
  background: rgba(255,255,255,.14);
  color: var(--white);
  box-shadow: 0 1px 4px rgba(0,0,0,.2);
}
.role-sw-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

.lform { display: none; }
.lform.active { display: block; }

/* Form controls — login */
.lf-group { margin-bottom: 14px; }
.lf-lbl {
  display: block; font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,.45);
  text-transform: uppercase; letter-spacing: .6px;
  margin-bottom: 6px;
}
.lf-inp {
  width: 100%; padding: 13px 15px;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--r-sm);
  font-size: 15px; color: var(--white);
  outline: none; transition: border-color .18s, background .18s;
  -webkit-appearance: none;
}
.lf-inp::placeholder { color: rgba(255,255,255,.25); }
.lf-inp:focus {
  border-color: var(--gold);
  background: rgba(255,255,255,.12);
}
.lf-inp.err { border-color: var(--red-mid); }
.lf-inp option { background: var(--accent-2); color: var(--white); }

.btn-login {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-lt) 100%);
  color: var(--accent); border: none; border-radius: var(--r-sm);
  font-size: 15px; font-weight: 700; cursor: pointer;
  margin-top: 6px;
  box-shadow: 0 4px 20px rgba(184,146,42,.4);
  transition: opacity .18s, transform .12s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-login:active { opacity: .88; transform: scale(.98); }
.btn-login svg { width: 16px; height: 16px; }
.login-err {
  font-size: 12px; color: var(--red-mid); text-align: center;
  margin-top: 10px; min-height: 18px;
}

/* ══════════════════════════════════════
   APP SHELL (Staff + SM)
══════════════════════════════════════ */
.app-header {
  display: flex; align-items: center;
  padding: 0 16px;
  height: 56px;
  position: sticky; top: 0; z-index: 200;
  flex-shrink: 0;
}
.staff-header { background: var(--accent); }
.sm-header {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-3) 100%);
}
.app-header::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 1px; background: rgba(255,255,255,.08);
}

.hdr-brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.hdr-dot {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, var(--gold), var(--gold-lt));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.hdr-dot svg { width: 14px; height: 14px; color: var(--navy); }
.hdr-name {
  font-size: 14px; font-weight: 600; color: var(--white);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-sub { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 1px; }

.hdr-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.hdr-chip {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.12);
  color: rgba(255,255,255,.75);
  padding: 4px 11px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
}
.hdr-clock {
  font-family: 'DM Mono', monospace;
  font-size: 12px; color: var(--gold); font-weight: 500;
  letter-spacing: .05em;
}
/* ── Header completion meter (additive; mirrors the slim Service-form meter) ── */
.hdr-meter {
  display: flex; align-items: center; gap: 7px;
  flex-shrink: 0; min-width: 0;
}
.hdr-meter-track {
  width: 56px; height: 3px;
  background: rgba(255,255,255,.16);
  border-radius: 99px; overflow: hidden; flex-shrink: 0;
}
.hdr-meter-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--gold-lt));
  border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1);
}
.hdr-meter-lbl {
  font-size: 11px; font-weight: 600;
  color: rgba(255,255,255,.7);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.hdr-btn-exit {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.1);
  color: rgba(255,255,255,.6);
  padding: 6px 12px; border-radius: var(--r-xs);
  font-size: 12px; font-weight: 600; cursor: pointer;
  white-space: nowrap; transition: all .15s;
}
.hdr-btn-exit:hover { background: rgba(255,255,255,.14); color: var(--white); }

/* ── TAB BAR ── */
.tabbar {
  /* Scroll-shadow affordance (pure CSS, no markup): a subtle edge shadow appears
     when the tab strip can scroll that way, and is covered at the ends. */
  background:
    linear-gradient(to right, var(--white), rgba(255,255,255,0)) 0 0/24px 100% no-repeat local,
    linear-gradient(to left, var(--white), rgba(255,255,255,0)) 100% 0/24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, rgba(13,35,64,.16), rgba(13,35,64,0)) 0 0/13px 100% no-repeat,
    radial-gradient(farthest-side at 100% 50%, rgba(13,35,64,.16), rgba(13,35,64,0)) 100% 0/13px 100% no-repeat,
    var(--white);
  border-bottom: 1px solid var(--border);
  overflow-x: auto; -webkit-overflow-scrolling: touch;
  scrollbar-width: none; flex-shrink: 0;
}
.tabbar::-webkit-scrollbar { display: none; }
.tabbar-inner {
  display: flex; padding: 0 12px;
  white-space: nowrap; min-width: max-content;
}
.tab-btn {
  padding: 0 14px; height: 44px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500;
  color: var(--muted); cursor: pointer;
  border: none; background: transparent;
  border-bottom: 2px solid transparent;
  transition: all .16s; white-space: nowrap;
  position: relative;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.tab-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--green); display: none; flex-shrink: 0;
}
.tab-btn.done .tab-dot { display: block; }

/* ── PROGRESS BAR ── */
.progress-wrap {
  background: var(--white);
  padding: 8px 16px 10px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border-2);
  flex-shrink: 0;
}
.progress-track {
  flex: 1; height: 3px;
  background: var(--border);
  border-radius: 99px; overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--gold));
  border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1);
}
.progress-label {
  font-size: 11px; font-weight: 600; color: var(--subtle);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}

/* ── CONTENT AREA ── */
.content-area {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  background: var(--surface);
}
.tsec { display: none; }
.tsec.active { display: block; }

/* ─────────────────────────────────────────
   DESIGN SYSTEM COMPONENTS
───────────────────────────────────────── */

/* Card */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--sh-xs);
  padding: 18px;
  margin-bottom: 12px;
}
.card-hdr {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.card-title {
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 600; color: var(--ink);
}
.card-icon {
  width: 32px; height: 32px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ci-navy   { background: rgba(13,35,64,.08); color: var(--accent); }
.ci-gold   { background: var(--gold-pale); color: var(--gold); }
.ci-green  { background: var(--green-pale); color: var(--green); }
.ci-amber  { background: var(--amber-pale); color: var(--amber); }
.ci-red    { background: var(--red-pale); color: var(--red); }
.ci-sky    { background: var(--sky-pale); color: var(--sky); }
.card-icon svg { width: 15px; height: 15px; }

/* Info rows */
.info-row {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-2);
  font-size: 14px;
}
.info-row:last-child { border-bottom: none; }
.info-key { color: var(--muted); font-weight: 400; }
.info-val { font-weight: 600; color: var(--ink); text-align: right; }

/* Form */
.fgrp { margin-bottom: 13px; }
.flbl {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--muted); text-transform: uppercase;
  letter-spacing: .5px; margin-bottom: 6px;
}
.req { color: var(--red); }
.finp {
  width: 100%; padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: 14px; color: var(--ink);
  background: var(--white); outline: none;
  -webkit-appearance: none;
  transition: border-color .16s, box-shadow .16s;
}
.finp:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(13,35,64,.07);
}
.finp:disabled { background: var(--surface); color: var(--subtle); }
.finp.err { border-color: var(--red); }
.fgrid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
textarea.finp { resize: vertical; min-height: 72px; }
.finp option { background: var(--white); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 10px 16px;
  border-radius: var(--r-sm);
  font-size: 13px; font-weight: 600;
  border: none; cursor: pointer;
  transition: all .15s; line-height: 1;
  white-space: nowrap;
}
.btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.btn-primary { background: var(--accent); color: var(--white); }
.btn-primary:hover { background: var(--accent-2); }
.btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-lt)); color: var(--accent); }
.btn-green { background: var(--green); color: var(--white); }
.btn-green:hover { background: var(--green); filter: brightness(.92); }
.btn-red { background: var(--red); color: var(--white); }
.btn-amber { background: var(--amber); color: var(--white); }
.btn-outline {
  background: var(--white); color: var(--ink-3);
  border: 1.5px solid var(--border);
}
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-ghost {
  background: transparent; color: var(--muted);
  border: 1.5px solid var(--border);
}
.btn-ghost:hover { color: var(--red); border-color: var(--red); }
.btn-sm { padding: 6px 12px; font-size: 11px; border-radius: 7px; min-height: 44px; }
.btn-lg { width: 100%; padding: 14px 20px; font-size: 14px; border-radius: var(--r-sm); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Summary bar */
.summary-bar {
  background: var(--accent);
  background-image: radial-gradient(ellipse 80% 100% at 100% 50%, rgba(184,146,42,.15) 0%, transparent 70%);
  color: var(--white);
  padding: 16px 18px;
  border-radius: var(--r);
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
  box-shadow: var(--sh-sm);
}
.summary-bar-lbl { font-size: 12px; color: rgba(255,255,255,.55); font-weight: 500; }
.summary-bar-val { font-size: 22px; font-weight: 700; margin-top: 2px; letter-spacing: -.5px; }
.summary-bar-val .sub { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.6); margin-left: 6px; }

/* Status badge */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
}
.badge-green { background: var(--green-pale); color: var(--green); }
.badge-amber { background: var(--amber-pale); color: var(--amber); }
.badge-red   { background: var(--red-pale); color: var(--red); }
.badge-navy  { background: rgba(13,35,64,.08); color: var(--accent); }
.badge-gold  { background: var(--gold-pale); color: var(--gold); }
.badge svg   { width: 10px; height: 10px; }

/* Stock grid */
.sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.stotal {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 12px 14px; margin-top: 8px;
}
.stotal-lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.stotal-val { font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

/* Group header */
.group-hdr {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .6px;
  padding: 10px 0 6px; margin-top: 4px;
  border-bottom: 1px solid var(--border-2);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}

/* In/Out status */
.io-status {
  border-radius: var(--r);
  padding: 16px;
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 14px;
  border: 1px solid;
}
.io-in  { background: var(--green-pale); border-color: var(--green-mid); }
.io-out { background: var(--amber-pale); border-color: var(--amber-mid); }
.io-pulse {
  width: 12px; height: 12px; border-radius: 50%;
  flex-shrink: 0; position: relative;
}
.io-in .io-pulse { background: var(--green); box-shadow: 0 0 0 4px rgba(22,101,52,.2); }
.io-out .io-pulse { background: var(--amber); box-shadow: 0 0 0 4px rgba(180,83,9,.2); }
.io-status-body { flex: 1; }
.io-status-label { font-size: 14px; font-weight: 600; }
.io-in  .io-status-label { color: var(--green); }
.io-out .io-status-label { color: var(--amber); }
.io-status-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.log-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-2);
  font-size: 13px;
}
.log-item:last-child { border-bottom: none; }
.log-badge {
  padding: 2px 9px; border-radius: 99px;
  font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.log-badge.out { background: var(--amber-pale); color: var(--amber); }
.log-badge.in  { background: var(--green-pale); color: var(--green); }
.log-reason { color: var(--muted); flex: 1; }
.log-time { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--subtle); white-space: nowrap; }

/* Entry items */
.entry-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 14px;
  margin-bottom: 10px;
}
.entry-hdr {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.entry-num {
  font-size: 11px; font-weight: 700;
  color: var(--accent); text-transform: uppercase;
  letter-spacing: .4px;
}
.entry-detail { font-size: 13px; color: var(--muted); line-height: 1.7; }
.entry-detail b { color: var(--ink); font-weight: 600; }
.entry-amount {
  font-size: 17px; font-weight: 700;
  color: var(--green); margin-top: 5px;
  font-variant-numeric: tabular-nums;
}

/* Tasks */
.task-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--border-2);
}
.task-row:last-child { border-bottom: none; }
.task-lbl { flex: 1; font-size: 14px; color: var(--ink-3); font-weight: 400; }
.task-num-wrap { display: flex; align-items: center; gap: 8px; }
.task-num-inp { width: 88px; text-align: center; font-weight: 700; color: var(--accent); }
.task-unit { font-size: 11px; font-weight: 600; color: var(--subtle); text-transform: uppercase; letter-spacing: .3px; }
.task-total {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 12px 14px; margin-top: 6px;
}
.task-total-lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.task-total-val { font-size: 20px; font-weight: 700; color: var(--accent); }

/* Marketing counter cards */
.mkt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mkt-card {
  background: var(--white);
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 16px 14px; text-align: center;
  transition: border-color .15s;
}
.mkt-card:hover { border-color: var(--accent); }
.mkt-icon {
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(13,35,64,.06);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 10px;
}
.mkt-icon svg { width: 18px; height: 18px; color: var(--accent); }
.mkt-lbl { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
.mkt-counter { display: flex; align-items: center; justify-content: center; gap: 12px; }
.mkt-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--white); color: var(--ink);
  font-size: 18px; font-weight: 500;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .14s; flex-shrink: 0;
  line-height: 1;
}
.mkt-btn:hover { background: var(--accent); color: var(--white); border-color: var(--accent); }
.mkt-val {
  font-size: 26px; font-weight: 700; color: var(--accent);
  min-width: 30px; text-align: center;
  font-variant-numeric: tabular-nums;
}

/* Cleaning */
.cp-card {
  border: 1.5px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 12px;
  transition: border-color .2s;
}
.cp-card.cp-done { border-color: var(--green-mid); background: rgba(240,253,244,.5); }
.cp-hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.cp-circle {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 11px; font-weight: 700;
  color: var(--muted); transition: all .2s;
}
.cp-done .cp-circle { background: var(--green); border-color: var(--green); color: var(--white); }
.cp-circle svg { width: 12px; height: 12px; }
.cp-lbl { font-size: 14px; font-weight: 600; color: var(--ink-3); }
.cp-done .cp-lbl { color: var(--green); }
.cp-check-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px; cursor: pointer;
}
.cp-check-row input[type=checkbox] {
  width: 18px; height: 18px;
  accent-color: var(--green); cursor: pointer; flex-shrink: 0;
}
.cp-check-lbl { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.photo-zone {
  border: 1.5px dashed var(--border);
  border-radius: var(--r-sm);
  padding: 22px 16px; text-align: center;
  cursor: pointer; background: var(--surface);
  position: relative; overflow: hidden;
  transition: border-color .15s, background .15s;
}
.photo-zone:hover { border-color: var(--accent); background: rgba(13,35,64,.02); }
.photo-zone.has-photo { border-style: solid; border-color: var(--green); padding: 0; }
.photo-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.photo-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
.photo-icon svg { width: 18px; height: 18px; color: var(--muted); }
.photo-lbl-text { font-size: 12px; color: var(--muted); font-weight: 500; }
.photo-prev { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; display: none; }
.photo-prev.show { display: block; }
.cp-time { font-size: 11px; color: var(--muted); margin-top: 8px; text-align: center; font-family: 'DM Mono', monospace; }

/* Variance table */
.var-tbl { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border); }
.var-tbl th { background: var(--accent); color: var(--white); padding: 9px 12px; font-size: 11px; font-weight: 600; text-align: center; letter-spacing: .3px; }
.var-tbl th:first-child { text-align: left; }
.var-tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border-2); text-align: center; }
.var-tbl td:first-child { font-weight: 500; color: var(--ink-3); text-align: left; }
.var-tbl tr:last-child td { font-weight: 700; background: var(--surface); border-bottom: none; }
.var-pos { color: var(--green); font-weight: 700; }
.var-neg { color: var(--red); font-weight: 700; }
.var-zero { color: var(--subtle); }

/* Submit / Locked */
.submit-btn {
  width: 100%; padding: 16px; margin-top: 16px;
  background: linear-gradient(135deg, var(--green) 0%, rgba(0,0,0,.18) 320%), var(--green);
  color: var(--white); border: none; border-radius: var(--r-sm);
  font-size: 15px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  box-shadow: 0 4px 16px rgba(22,101,52,.30);
  transition: opacity .15s;
}
.submit-btn:active { opacity: .88; }
.submit-btn:disabled { background: var(--border); color: var(--subtle); box-shadow: none; cursor: not-allowed; }
.submit-btn svg { width: 16px; height: 16px; }
.locked-view {
  background: var(--green-pale);
  border: 1.5px solid var(--green-mid);
  border-radius: var(--r);
  padding: 28px 20px; text-align: center; margin-top: 12px;
}
.locked-icon { margin-bottom: 10px; }
.locked-icon svg { width: 36px; height: 36px; color: var(--green); }
.locked-title { font-size: 16px; font-weight: 700; color: var(--green); }
.locked-sub { font-size: 12px; color: var(--muted); margin-top: 5px; font-family: 'DM Mono', monospace; }
.missing-list {
  background: var(--red-pale); border: 1px solid var(--red-mid);
  border-radius: var(--r-sm); padding: 12px 16px; margin-top: 12px;
  font-size: 13px; color: var(--red);
}
.missing-list strong { display: block; margin-bottom: 8px; font-weight: 700; }
.missing-list li { margin: 4px 0 4px 16px; line-height: 1.5; }

/* Empty state */
.empty-state { text-align: center; padding: 40px 20px; }
.empty-icon-wrap {
  width: 56px; height: 56px; border-radius: 16px;
  background: var(--border-2); display: flex; align-items: center;
  justify-content: center; margin: 0 auto 14px;
}
.empty-icon-wrap svg { width: 24px; height: 24px; color: var(--subtle); }
.empty-title { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.empty-sub { font-size: 12px; color: var(--subtle); line-height: 1.6; }

/* ─── SM PANEL ─── */
.sm-date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.sm-date-inp {
  flex: 1; padding: 10px 13px;
  border: 1.5px solid var(--border); border-radius: var(--r-sm);
  font-size: 14px; color: var(--ink); outline: none;
  transition: border-color .16s; -webkit-appearance: none;
}
.sm-date-inp:focus { border-color: var(--accent); }

/* Submission list */
.sub-item {
  background: var(--white); border: 1.5px solid var(--border);
  border-radius: var(--r); padding: 14px;
  margin-bottom: 10px; cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  transition: border-color .15s, box-shadow .15s;
}
.sub-item:hover { border-color: var(--accent); box-shadow: var(--sh-sm); }
.sub-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: var(--white);
  flex-shrink: 0; text-transform: uppercase;
  font-family: 'DM Mono', monospace;
}
.sub-info { flex: 1; min-width: 0; }
.sub-name { font-size: 14px; font-weight: 600; color: var(--ink); }
.sub-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

/* Report sections */
.report-sec { margin-bottom: 16px; }
.rsec-hdr {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .6px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}
.rrow {
  display: flex; align-items: flex-start;
  justify-content: space-between;
  padding: 6px 0; font-size: 13px;
  border-bottom: 1px solid var(--border-2);
}
.rrow:last-child { border-bottom: none; }
.rkey { color: var(--muted); flex: 1; line-height: 1.5; }
.rval { font-weight: 600; color: var(--ink); text-align: right; max-width: 55%; }

/* Score grid */
.score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.score-item {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--r-sm); padding: 12px;
}
.score-lbl { font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 2px; text-transform: capitalize; }
.score-max { font-size: 11px; color: var(--subtle); margin-bottom: 8px; }
.score-inp {
  width: 100%; padding: 8px; border: 1.5px solid var(--border);
  border-radius: var(--r-xs); font-size: 20px; font-weight: 700;
  text-align: center; color: var(--accent); outline: none;
  -webkit-appearance: none; font-variant-numeric: tabular-nums;
  transition: border-color .15s;
}
.score-inp:focus { border-color: var(--accent); }

.total-score-card {
  background: var(--accent);
  background-image: radial-gradient(ellipse 80% 100% at 100% 50%, rgba(184,146,42,.15) 0%, transparent 70%);
  color: var(--white); border-radius: var(--r);
  padding: 20px; text-align: center; margin: 14px 0;
}
.tsc-num {
  font-family: var(--font-serif);
  font-size: 56px; font-weight: 400; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.tsc-denom { font-size: 20px; opacity: .5; font-weight: 400; }
.tsc-lbl { font-size: 12px; opacity: .55; margin-top: 4px; }
.tsc-grade { font-size: 14px; font-weight: 600; color: var(--gold-lt); margin-top: 6px; }

.audit-ar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.btn-approve, .btn-reject {
  padding: 13px; border-radius: var(--r-sm); border: none;
  font-size: 14px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  transition: opacity .15s;
}
.btn-approve { background: var(--green); color: var(--white); }
.btn-reject { background: var(--red); color: var(--white); }
.btn-approve:hover, .btn-reject:hover { opacity: .88; }
.btn-approve svg, .btn-reject svg { width: 15px; height: 15px; }
.audit-done-view {
  background: var(--green-pale); border: 1.5px solid var(--green-mid);
  border-radius: var(--r); padding: 20px; text-align: center; margin-top: 12px;
}
.audit-done-view .ado-icon svg { width: 40px; height: 40px; color: var(--green); margin-bottom: 10px; }
.audit-done-view .ado-icon.rejected svg { color: var(--red); }
.audit-done-view .ado-title { font-size: 16px; font-weight: 700; color: var(--green); }
.audit-done-view.rejected { background: var(--red-pale); border-color: var(--red-mid); }
.audit-done-view.rejected .ado-title { color: var(--red); }

/* Dashboard */
.dash-kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.dkpi {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--r); padding: 16px; text-align: center;
}
.dkpi-val { font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.dkpi-lbl { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 5px; text-transform: uppercase; letter-spacing: .4px; }
.ptbl {
  width: 100%; border-collapse: collapse; font-size: 13px;
  background: var(--white); border-radius: var(--r); overflow: hidden;
  border: 1px solid var(--border);
}
.ptbl th {
  background: var(--surface); padding: 10px 12px;
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-align: left; border-bottom: 1px solid var(--border);
  text-transform: uppercase; letter-spacing: .4px;
}
.ptbl td { padding: 10px 12px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
.ptbl tr:last-child td { border-bottom: none; }
.sbar-wrap { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.sbar { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--gold)); }

/* Settings */
.staff-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(13,35,64,.06); border: 1px solid rgba(13,35,64,.12);
  color: var(--accent); padding: 6px 6px 6px 12px;
  border-radius: 99px; font-size: 12px; font-weight: 600;
}
.staff-chip-remove {
  cursor: pointer; opacity: .5; font-size: 18px;
  line-height: 1; transition: opacity .14s;
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; margin: -12px -6px -12px 0;
}
.staff-chip-remove:hover { opacity: 1; }
.danger-zone { border: 1.5px solid var(--red-mid); border-radius: var(--r); padding: 18px; margin-top: 12px; }
.danger-zone-hdr { font-size: 13px; font-weight: 700; color: var(--red); margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
.danger-zone-hdr svg { width: 14px; height: 14px; }

/* ── TOAST ── */
.toast-wrap {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 7px;
  pointer-events: none; width: calc(100% - 32px); max-width: 360px;
}
.toast {
  background: var(--ink); color: var(--white);
  padding: 12px 16px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500;
  box-shadow: var(--sh-md);
  display: flex; align-items: center; gap: 10px;
  animation: t-in .2s ease, t-out .3s ease 2.7s forwards;
  border-left: 3px solid rgba(255,255,255,.2);
}
.toast.ok   { border-left-color: var(--green); }
.toast.err  { background: var(--red-pale); color: var(--red); border-left-color: var(--red); }
.toast.warn { background: var(--amber-pale); color: var(--amber); border-left-color: var(--amber); }
.toast-icon { flex-shrink: 0; display: flex; align-items: center; }
.toast-icon svg { width: 14px; height: 14px; }
@keyframes t-in  { from { transform: translateY(10px); opacity: 0; } to { opacity: 1; transform: translateY(0); } }
@keyframes t-out { to { opacity: 0; transform: translateY(-4px); } }

/* ── MODAL ── */
.modal-ov {
  position: fixed; inset: 0;
  background: rgba(10,10,31,.55);
  backdrop-filter: blur(4px);
  z-index: 2000; display: none;
  align-items: flex-end; justify-content: center;
}
.modal-ov.open { display: flex; }
.modal-sheet {
  background: var(--white);
  border-radius: var(--r-xl) var(--r-xl) 0 0;
  padding: 18px 20px 32px;
  width: 100%; max-width: 480px;
  max-height: 88dvh; overflow-y: auto;
  animation: sheet-up .24s cubic-bezier(.34,1.56,.64,1);
}
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border); border-radius: 99px;
  margin: 0 auto 18px;
}
.modal-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 16px; }

/* ─────────────────────────────────────────
   MOBILE RESPONSIVE LAYER  (<=640px only)
   Added on top of the existing desktop rules.
   Wide screens are byte-unchanged.
───────────────────────────────────────── */
@media (max-width: 640px) {
  /* Stop any accidental horizontal page overflow */
  html, body { max-width: 100%; overflow-x: hidden; }

  /* Reclaim a little horizontal room on narrow phones */
  .content-area { padding: 12px; }

  /* No element should be able to force the viewport wider */
  .card, .summary-bar, .io-status, .entry-item, .cp-card,
  .sub-item, .total-score-card, .report-sec { min-width: 0; }

  /* Long words / refs (e.g. data values) must wrap, not overflow */
  .info-val, .rval, .entry-detail, .sub-meta, .hdr-name { overflow-wrap: anywhere; word-break: break-word; }

  /* ── 16px+ fonts on all text-entry controls → no focus-zoom ── */
  .finp, .lf-inp, .sm-date-inp, .score-inp, .task-num-inp,
  input.finp, select.finp, textarea.finp { font-size: 16px; }

  /* ── Touch targets: rows / buttons >= 44px tall ── */
  .btn-sm { padding: 10px 14px; min-height: 44px; }
  .role-sw-btn { min-height: 44px; }
  .tab-btn { min-height: 44px; }
  .mkt-btn { width: 44px; height: 44px; }

  /* ── Stock grids: keep 2 KPI-style columns but never overflow ── */
  /* (was repeat(auto-fit, minmax(160px,1fr)) which squashed/clipped) */
  .sgrid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .sgrid .finp { min-width: 0; }

  /* Small KPI / counter tile grids stay 2-up (allowed) but with min-width:0 */
  .mkt-grid, .score-grid, .dash-kpi-grid, .audit-ar-grid { min-width: 0; }
  .mkt-card, .score-item, .dkpi { min-width: 0; }

  /* Modal two-up field grid collapses to a single column */
  .fgrid2 { grid-template-columns: 1fr; }

  /* ── Wide data tables scroll horizontally instead of squashing ──
     These tables are generated by JS (.var-tbl, .ptbl) with no id/wrapper,
     so we make the table itself a horizontal scroll container. */
  .var-tbl, .ptbl {
    display: block;
    width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
  }
  /* Keep header/body aligned once the table is display:block */
  .var-tbl thead, .ptbl thead,
  .var-tbl tbody, .ptbl tbody { display: table; width: 100%; table-layout: fixed; }
  .var-tbl th, .var-tbl td { padding: 8px 8px; }
  .ptbl th, .ptbl td { padding: 9px 8px; }

  /* Summary numbers don't need to shrink, but keep them from clipping */
  .summary-bar-val { font-size: 20px; }
  .tsc-num { font-size: 48px; }

  /* Header chips/clock can get tight on 360px — allow a small shrink */
  .hdr-actions { gap: 6px; }
  .app-header { padding: 0 12px; }
  /* Header completion meter: narrow the track on phones, keep the % label */
  .hdr-meter { gap: 5px; }
  .hdr-meter-track { width: 40px; }

  /* ── Sticky identity column on wide data tables ──
     When .var-tbl / .ptbl become horizontal scrollers (above), pin the first
     column (Brand / Staff name) so the row identity stays visible while the
     numeric columns scroll under it. Pure CSS, no markup/handler change. */
  .var-tbl th:first-child, .var-tbl td:first-child,
  .ptbl th:first-child,  .ptbl td:first-child {
    position: sticky; left: 0; z-index: 1;
  }
  /* Opaque backgrounds so scrolled numbers don't show through the sticky cell */
  .var-tbl td:first-child { background: var(--white); }
  .var-tbl tr:last-child td:first-child { background: var(--surface); }
  .var-tbl th:first-child { background: var(--accent); }
  .ptbl th:first-child { background: var(--surface); }
  .ptbl td:first-child { background: var(--white); }
}

/* ── Numeric table columns: tabular figures for clean vertical alignment ──
   Applies on every viewport. The first column is the text identity (Brand /
   Staff), so tabular-nums targets the data cells from the 2nd column on. */
.var-tbl td:not(:first-child),
.var-tbl th:not(:first-child),
.ptbl  td:not(:first-child),
.ptbl  th:not(:first-child) {
  font-variant-numeric: tabular-nums;
}

/* Audit fix dsr-01: the module's table-repair rules (display:block + thead/tbody realignment
   + sticky first column) lived ONLY inside @media(max-width:640px). But the shell also forces
   table{display:block;overflow-x:auto} in two situations the module did NOT repair:
   (a) the uniform @media(max-width:920px) fires on any 641–920px viewport in BOTH modes, and
   (b) MOBILE_CSS html.bcc-mobile table{display:block} fires at wide widths in Mobile display.
   In those cases the table went display:block WITHOUT thead/tbody{display:table;table-layout:fixed},
   so header and body rows laid out as independent blocks and the Brand/Staff/Opening/Closing/Change
   (Stock Variance) and 5-col Staff Performance columns no longer lined up under their headers.
   Re-apply the SAME realignment (and sticky identity column) wherever the shell forces display:block.
   Additive CSS only — no markup/handler change. */
@media (max-width: 920px) {
  .var-tbl, .ptbl {
    display: block; width: 100%; overflow-x: auto;
    -webkit-overflow-scrolling: touch; white-space: nowrap;
  }
  .var-tbl thead, .ptbl thead,
  .var-tbl tbody, .ptbl tbody { display: table; width: 100%; table-layout: fixed; }
  .var-tbl th:first-child, .var-tbl td:first-child,
  .ptbl th:first-child,  .ptbl td:first-child { position: sticky; left: 0; z-index: 1; }
  .var-tbl td:first-child { background: var(--white); }
  .var-tbl tr:last-child td:first-child { background: var(--surface); }
  .var-tbl th:first-child { background: var(--accent); }
  .ptbl th:first-child { background: var(--surface); }
  .ptbl td:first-child { background: var(--white); }
}
html.bcc-mobile .var-tbl, html.bcc-mobile .ptbl {
  display: block; width: 100%; overflow-x: auto;
  -webkit-overflow-scrolling: touch; white-space: nowrap;
}
html.bcc-mobile .var-tbl thead, html.bcc-mobile .ptbl thead,
html.bcc-mobile .var-tbl tbody, html.bcc-mobile .ptbl tbody { display: table; width: 100%; table-layout: fixed; }
html.bcc-mobile .var-tbl th:first-child, html.bcc-mobile .var-tbl td:first-child,
html.bcc-mobile .ptbl th:first-child,  html.bcc-mobile .ptbl td:first-child { position: sticky; left: 0; z-index: 1; }
html.bcc-mobile .var-tbl td:first-child { background: var(--white); }
html.bcc-mobile .var-tbl tr:last-child td:first-child { background: var(--surface); }
html.bcc-mobile .var-tbl th:first-child { background: var(--accent); }
html.bcc-mobile .ptbl th:first-child { background: var(--surface); }
html.bcc-mobile .ptbl td:first-child { background: var(--white); }

/* ── DSR collapsible sections (Opening / Closing stock megaforms) ──
   The shell's delegated tap handler (gated on html.bcc-mobile) toggles each
   .accordion-panel's [hidden] attribute. On mobile this turns the long single
   column scroll of 35 stock inputs into navigable, collapsible product groups.

   GATING: the [hidden] collapse must ONLY apply in mobile mode. On desktop —
   and on a narrow window still in desktop mode — every section must stay open,
   because the accordion JS never runs there to expand them. So neutralize
   [hidden] whenever the doc is NOT in mobile mode (same pattern as tax.html). */
html:not(.bcc-mobile) .dsr-acc-panel[hidden] { display: block !important; }
/* Print must always show every section regardless of collapse state. */
@media print { .dsr-acc-panel[hidden] { display: block !important; } }

/* Group heading as a clear sub-section title with a divider. Reuses the
   .group-hdr scale; uppercase + bottom border so it reads well on every width. */
.accordion-header {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .6px;
  padding: 11px 2px 9px; margin-top: 6px;
  border-bottom: 1px solid var(--border-2);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
/* On mobile the header is tappable (the shell handler toggles its panel), so
   give it a button-like surface, a 44px touch target, and a chevron affordance. */
html.bcc-mobile .accordion-header {
  cursor: pointer; -webkit-user-select: none; user-select: none;
  min-height: 44px;
  justify-content: space-between;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 0 14px;
  margin-bottom: 8px;
}
html.bcc-mobile .accordion-header::after {
  content: ""; flex: 0 0 auto;
  width: 7px; height: 7px;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(45deg);
}

/* D4-DSR-CSS-2026-08-04 — sections with no daily obligation read distinctly from both
   completed (green dot) and pending (no dot), so a not-applicable tab is never
   mistaken for unfinished work. */
.tab-btn.optional .tab-dot { display: block; background: var(--muted, #9aa0a6); opacity: .55; }
.dsr-d4-missing { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.8; }
.dsr-d4-missing li { margin-bottom: 2px; }
.dsr-d4-carried {
  display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .02em;
  color: var(--muted, #9aa0a6); margin-left: 6px; white-space: nowrap;
}

</style>

<style id="st-v5-uniform-css">
/* No remote @import — app is fully offline (INTERNET permission removed); a render-blocking
   font fetch that can never resolve was a likely cause of module-open stalls. System fonts below. */
/* ── VISIBILITY FIX ── force light rendering so Android WebView dark-mode
   (algorithmic darkening / force-dark) cannot invert text to invisible.
   This is the root cause of "some text not visible" on phones/tablets. */
:root{color-scheme:light only}
html{color-scheme:light only;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif !important;forced-color-adjust:none}
h1,h2,h3,h4,h5,.title,.headline,.brand,.heading{font-family:'DM Serif Display',Georgia,serif !important;letter-spacing:.2px}
/* Don't fight module's own colors — only normalize font + base focus ring */
*:focus-visible{outline:2px solid #b8922a;outline-offset:1px}
button,input,select,textarea{font-family:inherit}
/* keep date/number/select text from going invisible on some Android WebViews */
input,select,textarea{-webkit-text-fill-color:currentColor;opacity:1}
input::placeholder,textarea::placeholder{-webkit-text-fill-color:#7a8699;opacity:1}
/* ── RESPONSIVE SAFETY (tablet + mobile), conservative so module layouts stay intact ── */
img,svg,video,canvas{max-width:100%;height:auto}
*{ -webkit-tap-highlight-color:rgba(184,146,42,.18) }
@media(max-width:920px){
  body{ padding-bottom:72px !important }                 /* clear the back-home FAB + injected gate banner */
  table{ display:block; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch }
  thead,tbody,tr{ width:max-content; min-width:100% }
}
@media(max-width:640px){
  html{ font-size:15px }
  button,.btn,a.btn,[role=button]{ min-height:40px }
  input,select,textarea{ min-height:38px; font-size:16px }   /* 16px stops iOS/Android zoom-on-focus */
}
@media print{ body{background:#fff !important;color:#000 !important} }

/* ════════════════════════════════════════════════════════════════════════
   GLOBAL FLOORS — accessibility minimums applied to EVERY module iframe
   (this block is injected unconditionally, mobile AND desktop). Two rules:
     1. No on-screen text smaller than 11px.
     2. Every interactive control is at least 44x44 with a real tap target.
   These are FLOORS: they only raise values that fall below the minimum, so
   module typography/spacing above the floor is untouched. !important is
   required because module + MOBILE_CSS rules set their own sizes with
   !important (some shrink table/label text to 9px and inputs below 44px).
   ════════════════════════════════════════════════════════════════════════ */
/* 1a — baseline text floor (NOT !important): max(11px,1em) keeps each element's
   inherited/declared size when it is already >=11px, and lifts anything smaller
   to 11px. Because it is low-priority, any module rule that sets a size >=11px
   still wins; this only catches unset or sub-11px text. svg/script/style are
   excluded so we never touch vector or non-rendered nodes. */
html body *:not(svg):not(svg *):not(script):not(style){
  font-size:max(11px, 1em);
}
/* 1b — hard floor (!important) for the small-text leaves that modules + MOBILE_CSS
   deliberately shrink to 9–10px (table cells, chips, captions, *-sub/-meta/-hint
   labels). Flooring these to 11px is the intent of the accessibility minimum.
   These are genuine small-text leaves, so 11px will not distort hierarchy. */
html body small,
html body .h-name,html body th,html body td,
html body .leave-chip,html body .mt,html body .badge,html body .chip,html body .pill,html body .tag,
html body figcaption,html body caption,html body legend,
html body [class*="-sub"],html body [class*="-meta"],html body [class*="-hint"],
html body [class*="-note"],html body [class*="-cap"],html body [class*="-label"],
html body [class*="-time"],html body [class*="-date"]{
  font-size:max(11px, 1em) !important;
}
/* 2 — interactive control floor: 44px min hit area + readable size. Covers
   normal controls AND tiny icon/delete/close/remove buttons that often ship at
   ~24–32px. The [class*=…] matches are scoped to button/a/[role=button] so a
   wrapper div like .delete-modal is never affected. min-width keeps icon-only
   buttons square-ish. */
html body button,
html body input:not([type=hidden]):not([type=checkbox]):not([type=radio]),
html body select,html body textarea,
html body a.btn,html body [role=button],html body label.btn,
html body .btn,html body .icon-btn,html body .iconbtn,
html body button[class*="close"],html body button[class*="delete"],html body button[class*="remove"],
html body button[class*="-del"],html body button[class*="icon"],
html body a[class*="close"],html body a[class*="delete"],html body a[class*="remove"]{
  min-height:44px !important;
  min-width:44px;
}
/* keep checkbox/radio compact but tappable (don't stretch the box itself) */
html body input[type=checkbox],html body input[type=radio]{
  min-width:18px !important;min-height:18px !important;
}
/* inputs/selects inside dense table cells: keep the 44px hit area but allow
   the cell width to drive horizontal size so tables don't blow out. */
html body td button,html body th button,
html body td input,html body th input,
html body td select,html body th select{
  min-width:0;
}
</style>

<script>
/* ══════════════════════════════════════════════════
   CONSTANTS & STATE
══════════════════════════════════════════════════ */
/* Store Manager access is owned by the shell session. This compatibility function uses the shell PIN verifier only when one is explicitly available and otherwise denies; no embedded default credential exists. */
function smPassOk(pw){
  /* R0-W1 SEC-03: route SM-login PIN verify through the shell (correct v2/legacy hashing + brute-force
     lockout + audit). Fail-open to the original raw check on an older shell / standalone preview. */
  try{
    var fn=null;
    try{ if(window.parent && window.parent!==window && typeof window.parent.SaagarAdminPinCheck==='function') fn=window.parent.SaagarAdminPinCheck; }catch(e){}
    if(!fn && typeof window.SaagarAdminPinCheck==='function') fn=window.SaagarAdminPinCheck;
    if(typeof fn==='function'){
      var r=fn(String(pw));
      if(r && typeof r==='object' && !r.noPin){
        if(r.locked){ try{ toast('Too many wrong PINs — try again in '+r.locked+'s'); }catch(e){} return false; }
        return !!r.ok;
      }
    }
  }catch(e){}
  return false;
}
/* R0-W1 SEC-04 (Slice B): resolve the shell's step-up re-auth across the srcdoc boundary.
   FAIL-OPEN ON SKEW: an older shell without the helper => TRUE => the action proceeds as today. */
function stReauth(label){
  var fn=null;
  try{ if(window.parent && window.parent!==window && typeof window.parent.SaagarReauth==='function') fn=window.parent.SaagarReauth; }catch(e){ fn=null; }
  if(!fn && typeof window.SaagarReauth==='function') fn=window.SaagarReauth;   /* standalone/preview */
  if(typeof fn!=='function') return true;                                       /* FAIL-OPEN: no helper => allow */
  try{ return fn(label||'money change')!==false; }catch(e){ return true; }      /* FAIL-OPEN: a throwing gate must never brick */
}
const SK_DSR   = 'saagar_dsr_';
const SK_STAFF = 'saagar_dsr_staff';

const DEFAULT_STAFF = [];

const IO_REASONS = ['Break','Work Related','Personal','Training','Site Visit','Other'];
const NP_REASONS = ['No Budget','Just Browsing','Will Decide Later','Price Issue','Wrong Design','Wrong Size','Other'];

const PROD_GROUPS = [
  { label: 'Titan World (WLMHW)', short: 'Titan World', items: [
    'CLASSIC','XYLYS','REGALIA','AUTOMATIC','EDGE','RAGA',
    'PURPLE GENTS','PURPLE LADIES','WORKWEAR','OCTANE','ZOOP','SKINN',
    'KARISHMA GENTS','KARISHMA LADIES','BANDHAN','FASTTRACK','SONATA',
    'VYB','SUPER FIBER','TEES','WALL CLOCK','TITAN SMART','FASTTRACK SMART'
  ]},
  { label: 'Helios (HEMW)', short: 'Helios', items: [
    'SEIKO','CITIZEN','CERRUTI','FOSSIL','GUESS','POLICE',
    'G-SHOCK','KENNETH COLE','TOMMY HILFIGER','ANNE KLEIN','AMAZFIT','FITBIT'
  ]},
];
const PROD_TYPES = PROD_GROUPS.flatMap(g => g.items);
const STOCK_CATS = PROD_GROUPS.flatMap(g =>
  g.items.map(name => ({ id: slugId(g.short + '_' + name), label: name, group: g.short }))
);
/* PERF: build a label+group → category lookup ONCE so per-row renders use an
   O(1) map read instead of STOCK_CATS.find() inside a 36-row .map(). */
const STOCK_CAT_BY = (() => {
  const m = {};
  STOCK_CATS.forEach(c => { m[c.group + ' ' + c.label] = c; });
  return m;
})();
function stockCatOf(label, group) { return STOCK_CAT_BY[group + ' ' + label]; }
/* Wave4 (store-aware brands): each CRO works at ONE store, so Opening/Closing should count + validate only
   that store's brands. staffStore() resolves the store NAME from the employee master (field 'store', already
   'Titan World'|'Helios' = PROD_GROUPS[].short). Unknown / free-typed / renamed staff → no match → fall back
   to ALL groups (legacy behaviour; never locks anyone out). Pure derive-at-read — no storage change. */
function staffStore(name){
  var who = String(name != null ? name : (typeof st!=='undefined' && st.staffName) || '').trim().toLowerCase();
  if(!who) return '';
  try { var em = JSON.parse(localStorage.getItem('saagar_employee_master_v1') || '[]');
    if(Array.isArray(em)){ for(var i=0;i<em.length;i++){ var e=em[i];
      if(e && e.active!==false && String(e.name||'').trim().toLowerCase()===who) return String(e.store||'').trim(); } }
  } catch(e){}
  return '';
}
function activeGroups(name){ var s=staffStore(name); var g=PROD_GROUPS.filter(function(x){return x.short===s;}); return g.length?g:PROD_GROUPS; }
function activeStockCats(name){ var shorts={}; activeGroups(name).forEach(function(g){shorts[g.short]=1;}); return STOCK_CATS.filter(function(c){return shorts[c.group];}); }

const TASK_LIST = [
  { id: 'cust',        label: 'Customer Handling Done' },
  { id: 'follow',      label: 'Follow-ups Completed' },
  { id: 'disp',        label: 'Display Maintained' },
  { id: 'clean_floor', label: 'Store Floor Cleaned' },
];

const MKT_ITEMS = [
  { id: 'calls',    label: 'Customer Calls',      svgPath: 'M3 3h2.5l1 3-1.5 1.5c.9 1.85 2.5 3.35 4.5 4.5L11 10.5l3 1V14a1 1 0 01-1 1C5.5 15 1 9.5 1 4a1 1 0 011-1z' },
  { id: 'whatsapp', label: 'WhatsApp Catalogue',  svgPath: 'M8 1a7 7 0 100 14c1.5 0 2.9-.47 4.05-1.27L14 14l-.73-1.95A7 7 0 008 1z' },
  { id: 'door',     label: 'Door-to-Door Visits', svgPath: 'M3 13V6l5-4 5 4v7H3zM6 13V9h4v4' },
  { id: 'instore',  label: 'In-Store Promotion',  svgPath: 'M1 9V7l10-5v12L1 9zM11 6.5c1.657 0 3 .672 3 1.5s-1.343 1.5-3 1.5' },
];

const SCORE_MAX = { opening: 10, sales: 20, marketing: 20, tasks: 10, cleaning: 20, closing: 20 };

let st = {
  screen: 'login',
  staffName: '', role: 'cro',
  date: todayStr(), tab: 'daystart',
  smTab: 'submissions', smDate: todayStr(),
  auditRec: null,
};

/* ── UTILITIES ── */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':' + String(d.getSeconds()).padStart(2,'0');
}
/* ── VIEW-DATE RAIL (shell-driven) ──
   window.__stAsOf = "YYYY-MM-DD" = the day the user wants to VIEW.
   Default the staff panel to it; when it is EARLIER than the real today
   the panel is strictly READ-ONLY (history view) and must NEVER write or
   auto-create a record. Empty/invalid/today → behave exactly as before. */
function isValidDateStr(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function stAsOfDate() {
  try { var a = window.__stAsOf; if (isValidDateStr(a)) return a; } catch(e){}
  return todayStr();
}
/* Read-only when the given date is strictly in the past (history). Today,
   future, empty or invalid all return false → normal editable behaviour. */
function isReadOnlyDate(date) { return isValidDateStr(date) && date < todayStr(); }
/* Read-only when the STAFF panel is currently viewing a past day. */
function isPastView() { return isReadOnlyDate(st.date); }
function fmtDate(s) {
  if (!s) return '—';
  const [y,m,d] = s.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d} ${months[+m-1]} ${y}`;
}
function fmtAmt(n) { return '₹' + (Number(n)||0).toLocaleString('en-IN'); }
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function slugId(s) { return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
function emptyStockValues() { return Object.fromEntries(STOCK_CATS.map(c => [c.id, ''])); }
function emptyTaskValues() { const o = { additional: '' }; TASK_LIST.forEach(t => o[t.id] = ''); return o; }
function taskNumber(v) {
  if (v === true) return 1;
  if (!v && v !== 0) return 0;
  const n = Number(v);
  return Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0;
}
function taskEntered(v) { return v !== null && v !== undefined && v !== '' && v !== false; }
function taskTotal(tasks) { return TASK_LIST.reduce((sum, t) => sum + taskNumber(tasks?.[t.id]), 0); }
function stockTotal(obj) { return STOCK_CATS.reduce((s, c) => s + (Number(obj[c.id])||0), 0); }
function normalizeRecord(rec) {
  rec.opening = rec.opening || {};
  rec.closing  = rec.closing  || {};
  STOCK_CATS.forEach(c => {
    if (rec.opening[c.id] === undefined) rec.opening[c.id] = '';
    if (rec.closing[c.id]  === undefined) rec.closing[c.id]  = '';
  });
  rec.tasks = rec.tasks || {};
  TASK_LIST.forEach(t => {
    if (rec.tasks[t.id] === true)  rec.tasks[t.id] = 1;
    else if (!taskEntered(rec.tasks[t.id])) rec.tasks[t.id] = '';
  });
  if (rec.tasks.additional === undefined) rec.tasks.additional = '';
  if (!Array.isArray(rec.nonpurch)) rec.nonpurch = [];
  rec.nonpurch.forEach(n => {
    if (n.mobile === undefined) n.mobile = '';
    if (n.followedUp === undefined) n.followedUp = false;                 // P1-14 follow-up pipeline
    if (n.followUpDate === undefined) n.followUpDate = '';                // P1-14 (set at create-time)
    if (n._fuRef === undefined || n._fuRef === null) n._fuRef = 'np_' + (rec.date||'') + '_' + Math.random().toString(36).slice(2,9); // P1-14 stable per-row id for write-back matching
  });
  /* P1-13 sale mobile + payment mode: default new optional fields so old sale rows round-trip. */
  if (!Array.isArray(rec.sales)) rec.sales = [];
  rec.sales.forEach(s => { if (s.mobile === undefined) s.mobile = ''; if (s.paymentMode === undefined) s.paymentMode = ''; });
  if (!Array.isArray(rec.visitors)) rec.visitors = [];
  /* Audit fix dsr-bug-01: the bridge (ensureDsr) can create a record with cleaning:{}/marketing:{}
     when a CRO gets QMS walk-ins before opening DSR. renderers assume cleaning.cp1/cp2 exist
     (rec.cleaning.cp1.done) and crash on the bare object. Additively restore the canonical shape. */

/* ── STORAGE ── */
function recKey(date, name) { return SK_DSR + date + '_' + name.replace(/\s+/g,'_'); }
function blankRecord(date, name, role) {
  return {
    date, staffName: name, role, loginTime: nowTime(),
    opening: emptyStockValues(), inout: [], sales: [],
    nonpurch: [], visitors: [], tasks: emptyTaskValues(),
    marketing: { calls:0, whatsapp:0, door:0, instore:0 },
    cleaning: {
      cp1: { done:false, photo:null, time:null },
      cp2: { done:false, photo:null, time:null },
    },
    closing: emptyStockValues(),
    submitted: false, submitTime: null, audit: null,
    unlockLog: [], submitRev: 0,
  };
}
/* A non-persisting, never-saved placeholder used ONLY when viewing a PAST day
   that has no stored record. Mirrors blankRecord's shape so renderers can read
   it safely, but is flagged _noRecord and stamps NO loginTime (no fabrication
   of a historical login). It is frozen-ish: saveRec() refuses to persist it. */
function readonlyNoRecord(date, name) {
  const r = blankRecord(date, name, st.role);
  r.loginTime = '—';
  r._noRecord = true;
  return r;
}
/* PERF: keep the live editable record in memory so per-keystroke handlers and
   updateProgress() don't re-parse localStorage every call. The cache holds a
   SINGLE editable record keyed by its storage key; switching date/staff (which
   changes the key) transparently reloads. Read-only "no submission"
   placeholders are NEVER cached (they are per-call throwaways). */
/* V6 CARRYFORWARD: when a staff member's day record has a completely empty
   Opening section, seed it from that same person's most recent prior day's
   Closing counts (looks back up to 7 days). Values stay fully editable;
   nothing is written until the record is saved through the normal paths. */
function prevDayStr(s, back) {
  const t = new Date(s + 'T00:00:00Z');
  t.setUTCDate(t.getUTCDate() - back);
  return t.toISOString().slice(0, 10);
}
function prefillOpeningFromPrev(r) {
  try {
    if (!r || r._noRecord || r.submitted || isReadOnlyDate(r.date)) return r;
    if (!STOCK_CATS.every(c => r.opening[c.id] === '')) return r;
    for (let back = 1; back <= 7; back++) {
      const raw = localStorage.getItem(recKey(prevDayStr(r.date, back), r.staffName));
      if (!raw) continue;
      const prev = JSON.parse(raw);
      if (!prev || !prev.closing) return r;
      STOCK_CATS.forEach(c => {
        const v = prev.closing[c.id];
        if (v !== '' && v !== undefined && v !== null) r.opening[c.id] = String(v);
      });
      return r;
    }
  } catch(e) {}
  return r;
}
/* ══════════════════════════════════════
   P1-14: NON-PURCHASE FOLLOW-UP PIPELINE
   Sibling prior-day scanners of prefillOpeningFromPrev. Strict flag-only
   write-back: the mark-contacted path flips ONLY followedUp=true on the matched
   prior-day nonpurch row, re-reading storage so it never clobbers concurrent
   bridge appends and never touches submitted / any other field. Fully offline
   (tel:/wa.me deep-links only). Matches rows by a stable _fuRef, not array index
   (bridge appends + row deletions shift indices).
══════════════════════════════════════ */
function _fuMobile10(m){ var d=String(m||'').replace(/\D/g,''); return d.length>=10 ? d.slice(-10) : ''; }
/* verify-fix (P1): a stable content signature for ref-less legacy / QMS-bridge non-purchase rows (no _fuRef in
   storage). scanFollowUps and _writeFollowUpFlag derive it identically so 'Mark contacted' can match + stamp them. */
function _fuSig(n){ return 'sig:'+_fuMobile10(n&&n.mobile)+'|'+String((n&&n.customer)||'').trim().toLowerCase(); }
function scanFollowUps(date, staffName, backDays){
  var out=[]; var N=backDays||3;
  for(var back=1; back<=N; back++){
    var d=prevDayStr(date, back);
    var raw; try{ raw=localStorage.getItem(recKey(d, staffName)); }catch(e){ raw=null; }
    if(!raw) continue;
    var prev; try{ prev=JSON.parse(raw); }catch(e){ continue; }
    if(!prev || !Array.isArray(prev.nonpurch)) continue;
    prev.nonpurch.forEach(function(n){
      if(!n || n.followedUp===true) return;
      var m10=_fuMobile10(n.mobile);
      if(!m10) return;                                  // no usable mobile → nowhere to follow up
      out.push({ date:d, ref:(n._fuRef|| _fuSig(n)), customer:(n.customer||'').trim(), m10:m10,
                 reason:(n.reason||''), remarks:(n.remarks||''), followUpDate:(n.followUpDate||'') });
    });
  }
  out.sort(function(a,b){ return (a.followUpDate||a.date).localeCompare(b.followUpDate||b.date); });
  return out;
}
/* STRICT FLAG-ONLY WRITER: re-reads storage, flips ONLY followedUp=true on the
   matched row. Never CREATES a record; never touches submitted or any other
   field; does NOT use _recCache (that holds the live TODAY record). */
function _writeFollowUpFlag(date, refKey){
  try{
    var k=recKey(date, st.staffName);
    var raw=localStorage.getItem(k);
    if(!raw) return false;                              // never CREATE a record
    var rec=JSON.parse(raw);
    if(!rec || !Array.isArray(rec.nonpurch)) return false;
    var hit=null, sawFollowed=false;
    /* verify-fix (P1): match by _fuRef, OR (for ref-less legacy/QMS rows) by the same content sig scanFollowUps used.
       Prefer an UNFOLLOWED match; if every match is already followed, report idempotent success. */
    for(var i=0;i<rec.nonpurch.length;i++){ var n=rec.nonpurch[i]; if(!n) continue;
      var match = (n._fuRef===refKey) || (refKey && refKey.indexOf('sig:')===0 && _fuSig(n)===refKey);
      if(!match) continue;
      if(n.followedUp===true){ sawFollowed=true; continue; }
      hit=n; break;
    }
    if(!hit) return sawFollowed;                        // all matches already followed → true; none at all → false
    if(!hit._fuRef) hit._fuRef=refKey;                  // stamp ref-less rows so subsequent ops are stable by id
    hit.followedUp=true;                                // THE ONLY meaningful MUTATION (+ the stable-ref stamp)
    // rec.submitted is left EXACTLY as-is; if it was true it stays true.
    localStorage.setItem(k, JSON.stringify(rec));
    return true;
  }catch(e){ return false; }
}
function markFollowedUp(date, refKey){
  var ok=_writeFollowUpFlag(date, refKey);
  if(ok){ toast('Marked as contacted','ok'); }
  else { toast('Could not update — entry no longer found','err'); }
  renderDayStart();
}

let _recCache = { key: null, rec: null };
let _recSaveTimer = null;
/* Audit fix dsr-bug-02: DSR overwrites the WHOLE record on every save. The bridge (~60s tick)
   independently reads the same key, appends QMS-linked sales/nonpurch/visitors rows (source:'qms',
   keyed by sourceRef) and writes it back. A blind whole-record overwrite here silently drops any
   bridge row that landed in storage after this record was cached. Before writing, re-read storage
   and merge back any 'qms'-source row (by sourceRef) the in-memory record doesn't already have.
   In-memory wins for rows the staff already has (their edits/outcomes are never clobbered); we only
   RECOVER bridge rows that would otherwise be lost. Additive, no shape change. */
function _mergeBridgeRows(rec) {
  let merged = 0;
  try {
    const raw = localStorage.getItem(recKey(rec.date, rec.staffName));
    if (!raw) return merged;
    const stored = JSON.parse(raw);
    if (!stored || typeof stored !== 'object') return merged;
    ['sales','nonpurch','visitors'].forEach(arrKey => {
      const sArr = stored[arrKey];
      if (!Array.isArray(sArr)) return;
      if (!Array.isArray(rec[arrKey])) rec[arrKey] = [];
      const have = {};
      rec[arrKey].forEach(x => { if (x && x.sourceRef != null) have[String(x.sourceRef)] = 1; });
      sArr.forEach(x => {
        if (x && x.source === 'qms' && x.sourceRef != null && !have[String(x.sourceRef)]) { rec[arrKey].push(x); merged++; }
      });
    });
  } catch(e) {}
  return merged;   /* Audit fix dsr-bug-03: return how many bridge rows were recovered so the live re-hydrate can re-render only when something new appeared. */
}
function _writeRecNow(rec) {
  // Hard guard: never write while viewing the past, and never persist the
  // read-only placeholder. This is the single most important correctness rule.
  if (isReadOnlyDate(rec && rec.date) || (rec && rec._noRecord)) return;
  _mergeBridgeRows(rec);
  try { localStorage.setItem(recKey(rec.date, rec.staffName), JSON.stringify(rec)); } catch(e) {
    toast('Storage error — data may not be saved!','err');

/* Flush any pending debounced write immediately. Safe to call anytime; uses the

   even if st.date has since changed. */
function flushRec() {
  if (_recSaveTimer !== null) { clearTimeout(_recSaveTimer); _recSaveTimer = null; }

}
function getRecord() {
  const k = recKey(st.date, st.staffName);
  if (_recCache.key === k && _recCache.rec) return _recCache.rec;
  try {
    const s = localStorage.getItem(k);
    if (s) { const r = prefillOpeningFromPrev(normalizeRecord(JSON.parse(s))); _recCache = { key: k, rec: r }; return r; }
  } catch(e){}
  // PAST day with no saved record: NEVER fabricate via blankRecord (which would
  // stamp loginTime=nowTime()). Return a read-only "no submission" placeholder
  // and create nothing. Not cached.
  if (isPastView()) return readonlyNoRecord(st.date, st.staffName);
  const r = prefillOpeningFromPrev(blankRecord(st.date, st.staffName, st.role));
  _recCache = { key: k, rec: r };

}
/* Audit fix dsr-bug-03: getRecord() caches the editable record and only re-reads on
   date/staff change or logout — there is no storage-event listener or re-hydrate. When the
   bridge (~60s tick) injects a QMS walk-in visitor / SALE_CLOSED sale into the currently-open
   day's stored record, the Visitors/Sales tabs keep showing the stale cached arrays until the
   CRO switches date or reloads, so allocated customers never surface live. Here we merge (not
   replace) any bridge-injected qms* rows into the LIVE cache via the existing _mergeBridgeRows
   (in-flight staff edits are preserved) and, when something new landed AND we're on the tab
   that shows those rows, re-render it. Only acts on the currently-viewed TODAY record; past /
   no-record / mismatched-key caches are left untouched. Additive. */
function rehydrateBridgeRows() {
  try {
    const c = _recCache;
    if (!c || !c.rec || !c.key) return;
    if (c.rec._noRecord || isReadOnlyDate(c.rec.date)) return;
    if (c.key !== recKey(st.date, st.staffName)) return;   // cache is for a different day/staff than the one on screen
    const merged = _mergeBridgeRows(c.rec);
    if (merged > 0 && st.screen === 'staff') {
      if (st.tab === 'visitors') renderVisitors();

let _rehydrateTimer = null;
function startBridgeRehydrate() {

}
function stopBridgeRehydrate() {
  if (_rehydrateTimer !== null) { clearInterval(_rehydrateTimer); _rehydrateTimer = null; }
}
/* Cross-document nudge: srcdoc storage writes from the shell/bridge fire 'storage' here. */
window.addEventListener('storage', function(e){
  if (!e || !e.key || (e.key.indexOf(SK_DSR) !== 0)) return;

});
/* Synchronous save — unchanged semantics for all existing callers. Points the
   cache at this record, cancels any pending debounce for it, and persists now. */
function saveRec(rec) {
  if (rec && !rec._noRecord) _recCache = { key: recKey(rec.date, rec.staffName), rec };
  if (_recSaveTimer !== null) { clearTimeout(_recSaveTimer); _recSaveTimer = null; }
  _writeRecNow(rec);

/* PERF: debounced whole-record save for high-frequency typing handlers. The
   record stays live in the cache; the (stringify + setItem) is coalesced to one
   write ~300ms after typing stops. Pending writes are flushed on submit, logout,
   SM entry, date change and page hide so nothing is ever lost. */
function scheduleRecSave(rec) {
  if (isReadOnlyDate(rec && rec.date) || (rec && rec._noRecord)) return;
  _recCache = { key: recKey(rec.date, rec.staffName), rec };
  if (_recSaveTimer !== null) clearTimeout(_recSaveTimer);
  _recSaveTimer = setTimeout(() => { _recSaveTimer = null; _writeRecNow(rec); }, 300);

/* Audit fix dsr-bug-05: aggregation queries (Submissions list, Dashboard, CSV export) parse
   EVERY in-range DSR record, and each cleaning checkpoint stores a full base64 data-URL photo
   (~1.33MB each, ~2.7MB/record). Parsing tens of records with both photo blobs synchronously on
   the srcdoc main thread is the whole-blob ANR class this app has hit. None of these aggregation
   consumers read cleaning.cp*.photo (they read cp*.done, sales, tasks, marketing, audit only) —
   the single-record audit report reads photos via selectAudit's own fresh parse, NOT via these.
   So drop the two photo blobs right after parse, per record, before they accumulate in `recs`.

function getAllForDate(date) {
  const recs = [];
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(SK_DSR+date+'_')) continue;
    try { recs.push(_parseLiteRec(k)); } catch(e){}
  }
  return recs;
}
/* P1-15: EOD day summary grouped by store. Pure read (no writes). Store is
   derived per-CRO via staffStore() from the employee master; CROs with no store
   match bucket under 'Other'. If NO staff resolve to a known store the caller
   collapses to a single global block (byStore:false). */
function computeDsrDayByStore(date){
  const recs = getAllForDate(date);
  const groups = {};
  let anyStore = false;
  recs.forEach(r => {
    if(!r || !r.staffName) return;
    /* verify-fix: skip phantom bridge stubs (a CRO with QMS walk-ins who never opened the register) — they were
       never staffed in DSR, so they must not inflate Present/Pending. Mirrors the real-record test used elsewhere. */
    if(r._bridgeCreated && !r.submitted && (!r.loginTime || r.loginTime==='—')) return;
    let store = '';
    try { store = staffStore(r.staffName) || ''; } catch(e){ store = ''; }
    if(store) anyStore = true;
    const key = store || 'Other';
    const g = groups[key] || (groups[key] = { store:key, present:0, submitted:0, pending:0, salesAmt:0, salesCnt:0, top:null, topAmt:-1 });
    let amt=0, cnt=0;
    if(Array.isArray(r.sales)) r.sales.forEach(s=>{ const a=Number(s&&s.amount)||0; if(a>0){ amt+=a; cnt++; } });

function getAllInRange(from, to) {
  const recs = [];
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(SK_DSR)) continue;
    const m = k.match(/^saagar_dsr_(\d{4}-\d{2}-\d{2})_/);
    if (!m) continue;
    if (m[1] >= from && m[1] <= to) {
      try { recs.push(_parseLiteRec(k)); } catch(e){}
    }
  }
  return recs;
}
function getStaffList() {
  var out=[], seen={};
  function add(n){ var k=String(n||'').trim().toLowerCase(); if(n&&!seen[k]){seen[k]=1;out.push(n);} }
  try { var s=localStorage.getItem(SK_STAFF); if(s){var a=JSON.parse(s); if(Array.isArray(a)) a.forEach(add);} } catch(e){}
  try { var em=JSON.parse(localStorage.getItem('saagar_employee_master_v1')||'[]'); if(Array.isArray(em)) em.filter(function(x){return x&&x.name&&x.active!==false;}).forEach(function(x){add(x.name);}); } catch(e){}

    var gs=JSON.parse(localStorage.getItem('saagar_gate_status')||'null');
    var un=(gs&&gs.unavailable)||{};
    out=out.filter(function(n){ var e=un[String(n||'').trim().toLowerCase()]; return !(e&&e.leave===true); });
  } catch(e){}

}

function setLoginRole(role) {

  el('rtab-sm').classList.toggle('active', role==='sm');
  el('lform-staff').classList.toggle('active', role==='staff');

function loginStaff() {
  const name = el('staff-name-inp').value.trim();
  const role = el('staff-role-sel').value;
  if (!name) { el('staff-name-inp').classList.add('err'); el('login-err').textContent='Please enter your name.'; return; }
  el('staff-name-inp').classList.remove('err');
  const list = getStaffList();
  if (!list.includes(name)) { list.push(name); saveStaffList(list); }

function dsrD4PolicyApi() {

  try {
    return (window.parent && window.parent !== window &&
      window.parent.SaagarDsrCompletionPolicy) ||
      window.SaagarDsrCompletionPolicy || null;
  } catch (error) {

  }
}
function dsrD4Context() {
  try {
    return { stockCategories: activeStockCats(), taskList: TASK_LIST };
  } catch (error) {

  }
}
function dsrD4PrevClosingRecord(rec) {
  try {
    if (!rec || rec._noRecord) return null;
    for (let back = 1; back <= 7; back++) {
      const raw = localStorage.getItem(recKey(prevDayStr(rec.date, back), rec.staffName));
      if (!raw) continue;
      const prev = JSON.parse(raw);
      if (!prev || !prev.closing) return null;
      return { date: prevDayStr(rec.date, back), closing: prev.closing };
    }
  } catch (error) {}
  return null;
}
function dsrD4CarriedOpening(rec) {
  try {
    const api = dsrD4PolicyApi();
    if (!api) return {};
    return api.carriedOpeningFields(rec, dsrD4PrevClosingRecord(rec), dsrD4Context().stockCategories);
  } catch (error) {
    return {};
  }
}
function dsrD4NoSalesAck(rec) {
  const ack = rec && rec.d4NoSales;
  if (!ack || typeof ack !== 'object' || Array.isArray(ack)) return null;
  return (typeof ack.at === 'string' && ack.at.length > 0) ? ack : null;
}
function dsrD4ToggleNoSales() {
  const rec = getRecord();
  if (rec.submitted || isPastView()) return;
  if (Array.isArray(rec.sales) && rec.sales.length) {
    toast('Sales are recorded for today — nothing to confirm', 'err');

  }

    ? null
    : { at: nowTime(), by: rec.staffName || '' };
  saveRec(rec);
  renderSales();
  updateProgress();
}
function dsrD4Summary(rec) {
  const api = dsrD4PolicyApi();
  if (api) {
    try { return api.completionSummary(rec, dsrD4Context()); } catch (error) {}
  }
  const ctx = dsrD4Context();
  const cats = ctx.stockCategories || [];
  const tasks = ctx.taskList || [];
  const cleaning = (rec && rec.cleaning) || {};
  const cp1 = cleaning.cp1 || {};
  const cp2 = cleaning.cp2 || {};
  const status = {
    daystart: 'not_applicable', opening: 'incomplete', inout: 'not_applicable',
    sales: 'incomplete', nonpurch: 'not_applicable', tasks: 'incomplete',
    marketing: 'not_applicable', cleaning: 'incomplete', closing: 'incomplete'
  };
  if ((Array.isArray(rec && rec.sales) && rec.sales.length > 0) ||
      dsrD4NoSalesAck(rec) || (rec && rec.submitted)) status.sales = 'complete';
  if (cats.length && cats.every(c => rec && rec.opening && rec.opening[c.id] !== '' &&
    rec.opening[c.id] !== undefined && rec.opening[c.id] !== null)) status.opening = 'complete';
  if (cats.length && cats.every(c => rec && rec.closing && rec.closing[c.id] !== '' &&
    rec.closing[c.id] !== undefined && rec.closing[c.id] !== null)) status.closing = 'complete';
  if (tasks.length && tasks.every(t => taskEntered(rec && rec.tasks && rec.tasks[t.id]))) status.tasks = 'complete';
  if (cp1.done && cp1.photo && cp2.done && cp2.photo) status.cleaning = 'complete';
  const applicable = ['opening', 'sales', 'tasks', 'cleaning', 'closing'];
  const done = applicable.filter(id => status[id] === 'complete').length;
  return { status, done, total: applicable.length,
    percent: applicable.length ? Math.round(done / applicable.length * 100) : 0 };
}
