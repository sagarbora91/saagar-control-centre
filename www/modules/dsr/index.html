function updateProgress() {
  const rec = getRecord();
  const summary = dsrD4Summary(rec);
  const status = summary.status || {};
  const tabs = ['daystart','opening','inout','sales','nonpurch','tasks','marketing','cleaning','closing'];
  tabs.forEach(id => {
    const btn = el('stbtn-' + id);
    if (!btn) return;
    btn.classList.toggle('done', status[id] === 'complete');
    btn.classList.toggle('optional', status[id] === 'not_applicable');
  });
  const fill = el('pbar-fill');
  if (fill) fill.style.width = summary.percent + '%';
  const lbl = el('pbar-lbl');
  if (lbl) lbl.textContent = summary.done + ' / ' + summary.total;
  updateStaffMeter(summary.done, summary.total);
}
function updateStaffMeter(done, total) {
  try {
    total = total || 9;
    const pct = total ? Math.round(done / total * 100) : 0;
    const fill = el('staff-meter-fill');
    if (fill) fill.style.width = pct + '%';
    const lbl = el('staff-meter-lbl');
    if (lbl) lbl.textContent = done + '/' + total + ' sections · ' + pct + '%';
  } catch (e) {}
}

function calcTimeOut(log) {
  let total = 0, outTime = null;
  log.forEach(e => {
    if (e.type==='out') outTime = parseHMS(e.time);
    else if (e.type==='in' && outTime) { total += parseHMS(e.time) - outTime; outTime = null; }
  });
  /* Audit fix dsr-bug-04: parseHMS returns seconds-since-midnight (0..86400), but the
     still-out branch was adding Date.now()/1000 (Unix epoch seconds, ~1.75e9), yielding
     a ~1.75-billion-second duration ("486000h 0m"). Use current seconds-since-midnight to
     match parseHMS's unit. Pure arithmetic. */
  if (outTime) {
    const n = new Date();
    const nowSec = n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds();
    total += nowSec - outTime;
  }
  return total;
}
function parseHMS(hms) {
  const [h,m,s] = (hms||'00:00:00').split(':').map(Number);
  return h*3600 + m*60 + (s||0);
}
function fmtDur(secs) {
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60);

function saveSale(idx) {
  if (isPastView()) { closeModal(); return; }
  const billNo = el('s-bill').value.trim();
  const amount = el('s-amt').value;
  if (!billNo || !amount) {
    if (!billNo) el('s-bill').classList.add('err');
    if (!amount) el('s-amt').classList.add('err');
    toast('Bill number and amount required','err'); return;
  }
  // P1-13: optional customer mobile — validate only when non-blank (mirrors saveNP).
  const mobile = el('s-mobile').value.trim();
  if (mobile && (mobile.replace(/\D/g,'').length < 6 || !/^[0-9+\-\s]{6,15}$/.test(mobile))) { el('s-mobile').classList.add('err'); toast('Enter a valid mobile number','err'); return; }   /* verify-fix: require >=6 real DIGITS so symbol-only junk ('++++++') is rejected */
  const rec = getRecord();
  const prev = (idx !== null && rec.sales && rec.sales[idx]) ? rec.sales[idx] : {};
  const entry = Object.assign({}, prev, { billNo, product: el('s-prod').value, amount: +amount, customer: el('s-cust').value.trim(), mobile, paymentMode: el('s-paymode').value });
  if (entry.source === 'qms-visitor') entry._confirmed = true;
  // Non-blocking double-count guard: a manual sale has no sourceRef, so it can't match the QMS
  // bridge dedup. If an auto-filled QMS sale of the SAME amount already exists today, warn the CRO
  // (never block or merge — same-amount sales can be legitimate).
  var dupQms = (idx === null) && Array.isArray(rec.sales) && rec.sales.some(function(s){ return s && s.source === 'qms' && (+s.amount) === (+amount); });
  if (idx !== null) rec.sales[idx] = entry; else rec.sales.push(entry);
  saveRec(rec); closeModal(); renderSales();
  if (dupQms) toast('Saved. Note: a QMS auto-sale of \u20b9' + (+amount).toLocaleString('en-IN') + ' is already logged today \u2014 if this is the same sale, delete one.','warn');
  else if (entry.source === 'qms-visitor') toast('Sale saved — Queue Management will flag this lead for the SM to confirm & close','ok');
  else toast('Sale saved','ok');
}
function deleteSale(i) {
  if (isPastView()) return;
  const rec = getRecord();
  if (rec.sales[i] && rec.sales[i].source==='qms') { toast('This sale came from Queue Management and is locked — edit it there.','warn'); return; }
  if (!confirm('Remove this sale entry?')) return;
  rec.sales.splice(i,1); saveRec(rec); renderSales();
}

  reader.onload = e => {

    rec.cleaning[`cp${n}`].time = nowTime();
    rec.cleaning[`cp${n}`].done = true;
    saveRec(rec); renderCleaning(); updateProgress();
    toast(`Checkpoint ${n} photo saved`,'ok');

function updClosing(cat, val) {
  const rec = getRecord();
  if (rec.submitted || isPastView()) return;
  rec.closing[cat] = val;
  // PERF: rec stays live in memory; coalesce the whole-record write (debounced).
  scheduleRecSave(rec);
  el('cl-total').textContent = stockTotal(rec.closing);
  updateProgress();
}
function getMissingForSubmit(rec) {
  const api = dsrD4PolicyApi();
  if (api) {
    try { return api.missingForSubmit(rec, dsrD4Context()); } catch (error) {}
  }
  const m = [];
  if (!activeStockCats().every(c => rec.opening[c.id] !== '')) m.push('Opening stock — enter counts for all brands');
  if (!(Array.isArray(rec.sales) && rec.sales.length) && !dsrD4NoSalesAck(rec)) m.push('Sales — add the day’s bills, or confirm there were no sales today');
  if (!TASK_LIST.every(t => taskEntered(rec.tasks[t.id]))) m.push('Daily task counts — fill all items');
  if (!rec.cleaning.cp1.done || !rec.cleaning.cp1.photo) m.push('Cleaning Checkpoint 1 — mark done & attach photo');
  if (!rec.cleaning.cp2.done || !rec.cleaning.cp2.photo) m.push('Cleaning Checkpoint 2 — mark done & attach photo');
  if (!activeStockCats().every(c => rec.closing[c.id] !== '')) m.push('Closing stock — enter counts for all brands');
  return m;
}

function selectAudit(date, name) {
  st.auditRec = null;
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k===recKey(date,name) || k===recKey(date,name.replace(/_/g,' '))) {
      try { st.auditRec=JSON.parse(localStorage.getItem(k)); break; } catch(e){}
    }
  }
  if (!st.auditRec) {
    for (let i=0; i<localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(SK_DSR+date+'_')) {
        try {
          const r = JSON.parse(localStorage.getItem(k));
          if (r.staffName===name || r.staffName===name.replace(/_/g,' ')) { st.auditRec=r; break; }
        } catch(e){}

    }

function calcAutoScores(r) {
  return {
    opening: activeStockCats(r.staffName).every(c => r.opening[c.id]!=='') ? 10 : 0,
    sales: Math.min(20, r.sales.filter(x=>(+x.amount)>0).length * 4),   /* audit: only confirmed (amount>0) bills score */
    marketing: Math.min(20, MKT_ITEMS.reduce((s,m) => s+(+r.marketing[m.id]||0),0) * 2),
    tasks: Math.round(TASK_LIST.filter(t => taskNumber(r.tasks[t.id])>0).length / TASK_LIST.length * 10),
    cleaning: (r.cleaning.cp1.done&&r.cleaning.cp1.photo?10:0)+(r.cleaning.cp2.done&&r.cleaning.cp2.photo?10:0),
    closing: activeStockCats(r.staffName).every(c => r.closing[c.id]!=='') ? 20 : 0,
  };
}
function calcTotalScore() {
  let total = 0;
  Object.keys(SCORE_MAX).forEach(s => {
    const inp = el('sc-'+s);
    if (inp) total += Math.min(SCORE_MAX[s], Math.max(0, +inp.value||0));
  });
  const numEl = el('tsc-num'); if (numEl) numEl.textContent = total;
  const grEl = el('tsc-grade');
  if (grEl) grEl.textContent = total>=90?'Excellent':total>=75?'Good':total>=60?'Average':'Needs Improvement';
}
function submitAudit(approved) {
  const scores = {}; let total = 0;
  Object.keys(SCORE_MAX).forEach(s => {
    const v = Math.min(SCORE_MAX[s], Math.max(0, +el('sc-'+s)?.value||0));
    scores[s]=v; total+=v;
  });
  if (!st.auditRec) return;
  /* Audit fix dsr-bug-06: the bridge's DSR_SUBMITTED emitter reads r.audit.score, but the
     audit only ever stored r.audit.total, so the emitted payload score was always null
     (payroll avg-score bucket + cross-module dashboards read blank/zero). Additively mirror
     the numeric result under `score` too; `total` is kept for the existing in-module readers. */
  if(!stReauth('Sign off the DSR audit for '+st.auditRec.date))return;
  st.auditRec.audit = { approved, total, score: total, ...scores, remarks:el('audit-remarks')?.value||'', auditTime:nowTime() };
  saveRec(st.auditRec);
  toast(approved?'Report approved':'Report rejected', approved?'ok':'warn');
  renderSMAudit(); renderSMSubmissions();
}
function resetAudit() {
  if (!st.auditRec) return;
  if (!confirm('Reset this audit and re-score?')) return;
  st.auditRec.audit=null; saveRec(st.auditRec); renderSMAudit();
}
/* P1-12: SM "Unlock for correction". Reopens a SUBMITTED report so the CRO can
   fix an error and re-submit. Mandatory reason, append-only unlockLog audit trail,
   and a submitRev bump so the bridge re-fires DSR_SUBMITTED with a fresh id on the
   corrected re-submit. Writes st.auditRec (the SM's own detached parse) by explicit
   key — NOT saveRec, which would repoint _recCache to this detached copy and corrupt
   the CRO's live editable cache. Guards mirror _writeRecNow (never write a read-only
   past day, never persist a placeholder). */
function unlockForCorrection(){
  const r = st.auditRec;
  if (!r || !r.submitted) return;                    // only a submitted record can be unlocked
  if (isReadOnlyDate(r.date)) { toast('Past-day reports cannot be unlocked','err'); return; }
  if(!stReauth('Unlock a submitted DSR and DISCARD its audit'))return;
  const reason = (prompt('Reason for unlocking this submitted report (required):')||'').trim();
  if (!reason) { toast('A reason is required to unlock','err'); return; }   // MANDATORY
  // Actor: reuse Wave-6 #28 signed-in-staff attribution; fall back to 'Manager'.
  let by = 'Manager';
  try { const a = JSON.parse(localStorage.getItem('saagar_active_staff_v1')||'null'); if (a && a.name) by = String(a.name); } catch(e){}
  r.unlockLog = Array.isArray(r.unlockLog) ? r.unlockLog : [];
  r.unlockLog.push({ by, time: nowTime(), date: todayStr(), reason, prevScore: (r.audit && r.audit.total!=null) ? r.audit.total : null, prevAudit: (r.audit||null) });   /* verify-fix: snapshot the FULL prior audit (approved/remarks/breakdown), not just the score, so the trail isn't lost on unlock */
  r.submitted = false;
  r.submitTime = null;
  r.audit = null;                                    // null so it re-audits cleanly (scoring grid reappears)
  r.submitRev = (typeof r.submitRev==='number'?r.submitRev:0) + 1;   // bump → next submit re-fires DSR_SUBMITTED with a fresh id
  try {
    if (!isReadOnlyDate(r.date) && !r._noRecord) {
      _mergeBridgeRows(r);                           // don't clobber a QMS row that landed after selectAudit's parse
      localStorage.setItem(recKey(r.date, r.staffName), JSON.stringify(r));
      // If the CRO's live cache is this same record, invalidate it so getRecord re-reads the unlocked state.
      if (_recCache.key === recKey(r.date, r.staffName)) _recCache = { key:null, rec:null };
    }
  } catch(e){ toast('Storage error — unlock may not be saved!','err'); return; }
  toast('Report unlocked for correction — CRO can now edit & re-submit','ok');
  renderSMAudit(); renderSMSubmissions();
}

/* ── DASHBOARD ── */
function renderDashboard() {
  const to = todayStr();
  const fromD = new Date(); fromD.setDate(fromD.getDate()-29);
  const from = fromD.getFullYear()+'-'+String(fromD.getMonth()+1).padStart(2,'0')+'-'+String(fromD.getDate()).padStart(2,'0');
  const recs = getAllInRange(from, to).filter(r => r.submitted);

  const totalSales = recs.reduce((s,r)=>s+r.sales.reduce((ss,x)=>ss+(+x.amount||0),0),0);
  const approvedCount = recs.filter(r=>r.audit?.approved===true).length;
  const withScores = recs.filter(r=>r.audit?.total!=null);
  const avgScore = withScores.length>0 ? Math.round(withScores.reduce((s,r)=>s+r.audit.total,0)/withScores.length) : null;

  const byStaff = {};
  recs.forEach(r => {
    if (!byStaff[r.staffName]) byStaff[r.staffName]={days:0,sales:0,bills:0,scores:[],mkt:0};
    const s=byStaff[r.staffName];
    s.days++; s.bills+=r.sales.filter(x=>(+x.amount)>0).length;
    s.sales+=r.sales.reduce((ss,x)=>ss+(+x.amount||0),0);
    if (r.audit?.total!=null) s.scores.push(r.audit.total);
    s.mkt+=MKT_ITEMS.reduce((ss,m)=>ss+(+r.marketing[m.id]||0),0);
  });

  el('stsec-dashboard').innerHTML = `
    <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px">Last 30 Days</div>
    <div class="dash-kpi-grid">
      <div class="dkpi"><div class="dkpi-val">${recs.length}</div><div class="dkpi-lbl">Submitted</div></div>
      <div class="dkpi"><div class="dkpi-val">${approvedCount}</div><div class="dkpi-lbl">Approved</div></div>
      <div class="dkpi"><div class="dkpi-val">${fmtAmt(totalSales)}</div><div class="dkpi-lbl">Total Sales</div></div>
      <div class="dkpi"><div class="dkpi-val">${avgScore!=null?avgScore+'%':'—'}</div><div class="dkpi-lbl">Avg Score</div></div>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Staff Performance</div>
    ${Object.keys(byStaff).length===0
      ? `<div class="empty-state"><div class="empty-icon-wrap"><svg viewBox="0 0 16 16" fill="none"><rect x="1" y="8" width="4" height="7" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="6" y="4" width="4" height="11" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="1" width="4" height="14" rx="1" stroke="currentColor" stroke-width="1.5"/></svg></div><div class="empty-title">No data yet</div><div class="empty-sub">Submitted records from the last 30 days will appear here.</div></div>`
      : `<table class="ptbl">
           <thead><tr><th>Staff</th><th>Days</th><th>Sales</th><th>Mkt</th><th>Score</th></tr></thead>
           <tbody>
             ${Object.entries(byStaff).map(([name,d]) => {
               const avg = d.scores.length ? Math.round(d.scores.reduce((a,b)=>a+b,0)/d.scores.length) : null;
               return `<tr>
                 <td><strong>${esc(name)}</strong></td>
                 <td style="text-align:center">${d.days}</td>
                 <td>${fmtAmt(d.sales)}</td>
                 <td style="text-align:center">${d.mkt}</td>
                 <td>${avg!=null?`${avg}<div class="sbar-wrap"><div class="sbar" style="width:${avg}%"></div></div>`:'—'}</td>
               </tr>`;}).join('')}

         </table>`}

      <button class="btn btn-primary btn-sm" onclick="sendDsrDaySummary()">📲 Send Day Summary</button>
      <button class="btn btn-outline btn-sm" onclick="exportAllCSV()">Export 30-Day CSV</button>
      <button class="btn btn-outline btn-sm" onclick="exportAllCSV('today')">Export Today</button>

}
/* P1-15: one-tap end-of-day DSR summary → WhatsApp (offline wa.me; no phone =
   contact picker). Self-contained: no shell dependency. Mirrors downloadCSV's
   transient-anchor idiom. */
function sendDsrDaySummary(){
  const date = todayStr();   /* verify-fix: the day summary is always TODAY's close — the Dashboard is a 30-day rollup with no single selected date, so don't couple to the Submissions-tab st.smDate */
  const d = computeDsrDayByStore(date);
  if(d.total.present===0){ toast('No staff records for '+date,'warn'); return; }
  const INR = n => '₹'+(Math.round(Number(n)||0)).toLocaleString('en-IN');
  let longDate = date;
  try { longDate = new Date(date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); } catch(e){}
  const lines = ['*Saagar Traders — Daily Staff Register*', longDate, ''];
  lines.push('Present: '+d.total.present+' · Submitted: '+d.total.submitted+' · Pending: '+d.total.pending);
  lines.push('Bills: '+d.total.salesCnt+' · Sales: '+INR(d.total.salesAmt));
  if(d.byStore && d.groups.length>1){
    d.groups.forEach(g=>{
      lines.push('');
      lines.push('*'+g.store+'*');
      lines.push('Present '+g.present+' · Submitted '+g.submitted+' · Pending '+g.pending);
      lines.push('Bills '+g.salesCnt+' · '+INR(g.salesAmt));
      if(g.top && g.salesAmt>0) lines.push('Top: '+g.top+' ('+INR(g.topAmt)+')');
    });
  } else {
    const g0 = d.groups[0];
    if(g0 && g0.top && g0.salesAmt>0) lines.push('Top performer: '+g0.top+' ('+INR(g0.topAmt)+')');
  }
  lines.push('');
  lines.push('— Saagar Traders, Latur');
  const text = lines.join('\n');
  stWaLink('https://wa.me/?text=' + encodeURIComponent(text),'dsr-day-summary','owner-operational-summary');
}
function stWaLink(url,scopeId,purposeId){
  if(window.parent&&window.parent!==window){
    window.parent.postMessage({type:'ST_WA_LINK',url:url,scopeId:scopeId,purposeId:purposeId},'*');
    return;
  }
  toast('Controlled sharing is available only inside Saagar Control Centre.','err');
}

function addStaff() {
  const name = el('new-staff-inp').value.trim();

  list.push(name); saveStaffList(list);
  el('new-staff-inp').value='';
  renderSMSettings();
  toast('Staff added: '+name,'ok');
}
function removeStaff(i) {
  const list = getStaffList();
  if (!confirm(`Remove "${list[i]}" from staff list?`)) return;
  list.splice(i,1); saveStaffList(list);
  renderSMSettings(); toast('Staff removed','warn');

function confirmDeleteAll() {
  el('modal-body').innerHTML = `

    </div>

      <button class="btn btn-outline" style="flex:1" onclick="closeModal()">Cancel</button>
      <button class="btn btn-red" style="flex:1" onclick="doDeleteAll()">Delete All</button>
    </div>`;
  openModal();
}
function doDeleteAll() {
  if (el('del-confirm-inp')?.value !== 'DELETE') { toast('Type DELETE exactly','err'); return; }
  const toDelete = [];
  for (let i=0; i<localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(SK_DSR)) toDelete.push(k);
  }
  toDelete.forEach(k => localStorage.removeItem(k));
  closeModal(); toast(`${toDelete.length} records deleted`,'warn'); renderSMSubmissions();
}

/* ── CSV EXPORT ── */
function csvCell(v) { return '"' + String(v===null||v===undefined?'':v).replace(/"/g,'""') + '"'; }
function downloadCSV(filename, rows) {
  const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  if(window.parent&&window.parent!==window){
    window.parent.postMessage({type:'ST_SHARE',file:blob,fileName:filename.replace(/[\\/:*?"<>|]/g,'_').slice(0,160),title:'DSR CSV',exportId:'dsr-csv-export',scopeId:'dsr-register',scopeLabel:'daily staff register',rowCount:Math.max(0,rows.length-1),purposeId:'register-reporting'},'*');
    return;
  }
  toast('Controlled export is available only inside Saagar Control Centre.','err');
}
function exportSingleCSV() {
  const r = st.auditRec; if (!r) { toast('No record selected','err'); return; }
  const rows = [
    ['Field','Value'],
    ['Staff Name',r.staffName],['Date',r.date],['Role',r.role.toUpperCase()],
    ['Login Time',r.loginTime],['Submit Time',r.submitTime||'—'],
    ...STOCK_CATS.map(c=>['Opening '+c.label,r.opening[c.id]||0]),
    ['Total Sales Bills',r.sales.length],
    ['Total Sales Amount',r.sales.reduce((s,x)=>s+(+x.amount||0),0)],
    ...r.sales.map((s,i)=>['Sale #'+(i+1),`Bill:${s.billNo}|${s.product}|${s.amount}|${s.customer||'—'}|${s.mobile||'—'}|${s.paymentMode||'—'}`]),
    ['Non-Purchase Visitors',r.nonpurch.length],
    ...r.nonpurch.map((n,i)=>['Visitor #'+(i+1),`${n.customer||'Anon'}|${n.mobile||'—'}|${n.reason}|${n.remarks||'—'}`]),
    ...TASK_LIST.map(t=>['Task: '+t.label,taskNumber(r.tasks[t.id])]),
    ['Total Tasks',taskTotal(r.tasks)],
    ...MKT_ITEMS.map(m=>['Marketing: '+m.label,r.marketing[m.id]||0]),
    ['CP1',r.cleaning.cp1.done?'Done':'No'],['CP2',r.cleaning.cp2.done?'Done':'No'],
    ...STOCK_CATS.map(c=>['Closing '+c.label,r.closing[c.id]||0]),
    ['Score',r.audit?.total??'—'],
    ['Status',r.audit?.approved===true?'Approved':r.audit?.approved===false?'Rejected':'Pending'],
    ['SM Remarks',r.audit?.remarks||'—'],
  ];
  downloadCSV(`report_${r.date}_${r.staffName.replace(/\s/g,'_')}.csv`, rows);
}
function exportAllCSV(mode) {
  const to = todayStr();
  const fromD = new Date(); fromD.setDate(fromD.getDate()-29);
  const from = mode==='today' ? to : fromD.getFullYear()+'-'+String(fromD.getMonth()+1).padStart(2,'0')+'-'+String(fromD.getDate()).padStart(2,'0');
  const recs = getAllInRange(from, to).filter(r=>r.submitted);
  if (!recs.length) { toast('No records to export','warn'); return; }
  const rows = [['Date','Staff','Role','Login','Bills','Sales','Visitors','Mkt Total','Tasks Total','CP1','CP2','Score','Status']];
  recs.forEach(r => {
    rows.push([
      r.date, r.staffName, r.role.toUpperCase(), r.loginTime,
      r.sales.length, r.sales.reduce((s,x)=>s+(+x.amount||0),0),
      r.nonpurch.length, MKT_ITEMS.reduce((s,m)=>s+(+r.marketing[m.id]||0),0),
      taskTotal(r.tasks),
      r.cleaning.cp1.done?'Done':'No', r.cleaning.cp2.done?'Done':'No',
      r.audit?.total??'—',
      r.audit?.approved===true?'Approved':r.audit?.approved===false?'Rejected':'Pending',
    ]);
  });
  downloadCSV(`saagar_${mode==='today'?'today':from+'_to_'+to}.csv`, rows);
}

/* ── MODAL ── */
function openModal() { el('modal').classList.add('open'); }
function closeModal() { el('modal').classList.remove('open'); }
function modalBgClick(e) { if (e.target===el('modal')) closeModal(); }

/* ── VIEW-DATE RAIL: react to live date changes from the shell ──
   Update the staff panel's viewed day to the new as-of date and re-render.
   Today (default) keeps the existing editable behaviour; a past date flips the
   panel into strictly read-only history mode (no writes, no record creation). */
function applyViewDate(date) {
  flushRec(); // persist any pending edit for the current day before switching dates
  const next = isValidDateStr(date) ? date : todayStr();
  st.date = next;
  if (st.screen === 'staff' && st.staffName) {
    updateStaffHeaderDate();
    renderCurrentTab();
  }
}
window.addEventListener('st-date', function(e){
  const d = e && e.detail;
  applyViewDate(typeof d === 'string' ? d : (d && d.date));
});

/* PERF safety net: the per-keystroke save is debounced (~300ms), so if the app
   is backgrounded or closed within that window, flush the pending write
   synchronously. 'pagehide' + 'visibilitychange'(hidden) are the reliable
   mobile lifecycle hooks ('beforeunload' is unreliable on mobile). */
window.addEventListener('pagehide', flushRec);
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'hidden') flushRec();
});

/* ── INIT ── */
function init() {
  const today = todayStr();
  const [y,m,d] = today.split('-');
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  el('login-date-pill-text').textContent = `${d} ${months[+m-1]} ${y}`;

  const list = getStaffList();
  const dl = el('staff-datalist');
  dl.innerHTML = list.map(n => `<option value="${esc(n)}">`).join('');

  // Seed the staff panel's default viewed day from the shell's as-of date
  // (defaults to today). Login re-reads it, and 'st-date' keeps it live.
  st.date = stAsOfDate();
}

init();
</script>

<script id="st-v5-module-access-bridge">(function(){
var moduleId="dsr",lastContext=null;
function readContext(){
  try{
    var api=window.parent&&window.parent.SaagarOwnerSession;
    if(api&&typeof api.read==='function'){
      var value=api.read()||{};
      return {isOwner:value.isOwner===true,role:String(value.role||''),isManager:value.isManager===true};
    }
  }catch(e){}
  return {isOwner:false,role:'',isManager:false};
}
function accessMessage(text){
  try{ var err=document.getElementById('login-err'); if(err&&moduleId==='dsr') err.textContent=text; }catch(e){}
  try{ if(typeof toast==='function') moduleId==='stock'?toast(text,'err'):toast(text,'warn'); }catch(e){}
}
function refreshOwnerControls(){
  try{
    if(moduleId==='service'&&typeof renderDash==='function') renderDash();
    if(moduleId==='expense'&&typeof render==='function') render();
  }catch(e){}
}
function revokeManagerIfNeeded(context){
  try{
    if(moduleId==='stock'&&!context.isManager&&typeof st!=='undefined'&&st.mode==='sm'&&typeof commitMode==='function') commitMode('cro');
    if(moduleId==='dsr'&&!context.isManager&&typeof st!=='undefined'&&st.screen==='sm'&&typeof logout==='function') logout();
  }catch(e){}
}
function syncContext(){
  var context=readContext();
  revokeManagerIfNeeded(context);
  if(!lastContext||lastContext.isOwner!==context.isOwner) refreshOwnerControls();
  lastContext=context;
}
function setup(){
  if(moduleId==='service'||moduleId==='expense') window.isSuperAdmin=function(){ return readContext().isOwner===true; };
  if(moduleId==='stock'){
    var originalSetMode=window.setMode,originalGoTab=window.goTab;
    if(typeof originalSetMode==='function') window.setMode=function(mode){
      if(mode==='sm'){
        if(readContext().isManager){ try{ var modal=document.getElementById('sm-auth-modal'); if(modal) modal.style.display='none'; if(typeof commitMode==='function') commitMode('sm'); }catch(e){} }
        else accessMessage('Switch to Owner or Store Manager in the app header.');
        return;
      }
      return originalSetMode.apply(this,arguments);
    };
    if(typeof originalGoTab==='function') window.goTab=function(tab){
      if(tab==='settings'&&typeof st!=='undefined'&&st.mode!=='sm'){
        if(!readContext().isManager){ accessMessage('Switch to Owner or Store Manager in the app header.'); return; }
        try{ if(typeof commitMode==='function') commitMode('sm'); }catch(e){}
      }
      return originalGoTab.apply(this,arguments);
    };
  }
  if(moduleId==='dsr'){
    var originalSetLoginRole=window.setLoginRole;
    if(typeof originalSetLoginRole==='function') window.setLoginRole=function(role){
      if(role==='sm'){
        if(readContext().isManager){ try{ var err=document.getElementById('login-err'); if(err) err.textContent=''; if(typeof showScreen==='function') showScreen('sm'); if(typeof goSMTab==='function') goSMTab('submissions'); }catch(e){} }
        else{ try{ originalSetLoginRole.call(this,'staff'); }catch(e){} accessMessage('Switch to Owner or Store Manager in the app header.'); }
        return;
      }
      return originalSetLoginRole.apply(this,arguments);
    };
    window.loginSM=function(){
      if(!readContext().isManager){ accessMessage('Switch to Owner or Store Manager in the app header.'); return; }
      try{ var err=document.getElementById('login-err'); if(err) err.textContent=''; if(typeof showScreen==='function') showScreen('sm'); if(typeof goSMTab==='function') goSMTab('submissions'); }catch(e){}
    };
    try{ var password=document.getElementById('sm-pw-inp'); if(password&&password.parentElement) password.parentElement.style.display='none'; var button=document.querySelector('#lform-sm .btn-login'); if(button) button.textContent='Open Manager workspace'; }catch(e){}
  }
  syncContext();
}
window.addEventListener('message',function(event){ if(event&&event.source===window.parent&&event.data&&event.data.type==='ST_ACCESS_CONTEXT') syncContext(); });
setup();
})();</script>
