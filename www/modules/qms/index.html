   SHARED MOBILE UTILITIES (additive, html.bcc-mobile-scoped, opt-in via class

   ───────────────────────────────────────────────────────────────────────── */

html.bcc-mobile .bcc-card-label{color:var(--gray-500,#6b7280);font-weight:600;flex:0 0 auto;max-width:50%}

/* 1.5 Sticky action bar base — modules add the markup later; class provides the chrome. */

html.bcc-mobile .accordion-header::after{content:"⌄";font-size:14px;line-height:1;opacity:.6;transition:transform .2s}
html.bcc-mobile .accordion-header[aria-expanded="true"]::after{transform:rotate(180deg)}
/* ── Deferred cosmetic polish (P2/P3 content-clip / overflow / bottom-chrome guards) — additive, mobile-scoped ── */

html.bcc-mobile[data-mod="qms"] .audit-detail{overflow-wrap:anywhere !important;word-break:break-word !important}    /* qms-L08: JSON audit payload */
html.bcc-mobile[data-mod="expense"] .kpi .v{overflow-wrap:anywhere !important;word-break:break-word !important}      /* expense-L1: arbitrary Top-head / Status text */
html.bcc-mobile[data-mod="expense"] .name-cell{overflow-wrap:anywhere !important;word-break:break-word !important}   /* expense-L4: long vendor/customer name in card header */
html.bcc-mobile[data-mod="cro_audit"] .mtitle{flex:1 !important;min-width:0 !important;overflow:hidden !important;text-overflow:ellipsis !important;white-space:nowrap !important}  /* cro_audit-06: long CRO name crowds ✕ */
/* stage-filter chips: scroll on one line instead of ballooning to ~3 rows of 44px pills */

/* payroll Send-Slip card cell: let the two action buttons wrap instead of overflowing the narrow card */
html.bcc-mobile[data-mod="payroll"] #ms-table tbody td[data-label="Send Slip"]{flex-wrap:wrap !important}            /* payroll-L09 */
/* grooming Save FAB: keep it bottom-LEFT at all mobile widths (module only did so <=640) so it never sits over the shell's next-chip */
html.bcc-mobile[data-mod="grooming"] #grm-float-save{left:14px !important;right:auto !important}                     /* grm-01 */
/* transient toasts: lift clear of the shell bottom-nav / back-home FAB, and let long messages wrap */

html.bcc-mobile[data-mod="qms"] .toast{bottom:92px !important}                                                      /* qms-L11 */
html.bcc-mobile[data-mod="planning"] .toast{bottom:98px !important}                                                 /* planning toast over FAB */
html.bcc-mobile[data-mod="service"] .toast{max-width:calc(100vw - 32px) !important;white-space:normal !important}   /* svc-l7: long toast wrap at mid-mobile width */

<style>
:root{
  --navy:#0d2340; --navy-mid:#1a3a5c; --navy-light:#264d7a;
  --gold:#b8922a; --gold-light:#d4a843; --gold-pale:#fdf6e3;
  --cream:#faf8f3; --paper:#ffffff;
  --red:#b91c1c; --red-pale:#fef2f2; --amber:#b45309; --amber-pale:#fffbeb;
  --green:#166534; --green-pale:#f0fdf4; --blue:#1d4ed8; --blue-pale:#eff6ff;
  --gray-50:#fafafa; --gray-100:#f4f4f5; --gray-200:#e4e4e7; --gray-300:#d4d4d8;
  --gray-400:#a1a1aa; --gray-500:#71717a; --gray-600:#52525b; --gray-700:#3f3f46; --gray-800:#27272a;
  --radius:12px; --radius-lg:16px;
  --font-sans:'DM Sans',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --font-serif:'DM Serif Display',Georgia,'Times New Roman',serif;
}
:root{
  /* Module aliases mapped onto the shared design tokens (no forked hexes) */
  --ink:var(--gray-800);--ink2:var(--gray-700);--muted:var(--gray-500);--faint:var(--gray-400);
  --navy2:var(--navy-mid);--gold2:var(--gold-light);--goldtint:var(--gold-pale);
  --bg:var(--cream);--surface:var(--paper);--line:var(--gray-200);--line2:var(--gray-300);
  --orange:var(--amber);--purple:#7c3aed;
  --greentint:var(--green-pale);--redtint:var(--red-pale);--orangetint:var(--amber-pale);--bluetint:var(--blue-pale);
  --gold-dark:#967415;--green-dark:#0f4c26;--red-dark:#991b1b; /* hover shades derived from tokens */
  --r:var(--radius);--r2:10px;--r3:8px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
  --shadow2:0 2px 8px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.08);
  --sidebar:240px;--trans:.18s cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);height:100%;display:flex;overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.mono{font-family:'DM Mono',monospace}
.sidebar{width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;height:100vh;position:fixed;left:0;top:0;z-index:40;overflow-y:auto;overflow-x:hidden}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--gold),var(--gold2));display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--navy);flex-shrink:0}
.brand-name{line-height:1.2}
.brand-name strong{display:block;font-size:13px;font-weight:700;color:#fff;letter-spacing:-.2px}
.brand-name span{font-size:11px;color:rgba(255,255,255,.42);font-weight:500}
.nav-section{padding:12px 10px;flex:1}
.nav-label{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:rgba(255,255,255,.3);padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r2);color:rgba(255,255,255,.55);font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;transition:background var(--trans),color var(--trans);margin-bottom:1px}
.nav-item:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.nav-item.active{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav-item .nav-icon{width:18px;height:18px;opacity:.7;flex-shrink:0;display:grid;place-items:center}
.nav-item.active .nav-icon{opacity:1}
.nav-badge{margin-left:auto;background:var(--gold);color:var(--navy);border-radius:99px;font-size:11px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.sidebar-footer{padding:12px 10px;border-top:1px solid rgba(255,255,255,.08)}
.role-pill{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.07);border-radius:var(--r2);padding:8px 10px;margin-bottom:8px}
.role-pill span{font-size:11px;color:rgba(255,255,255,.5);font-weight:500}
.role-pill strong{font-size:13px;color:#fff;font-weight:600}
.role-btn{background:rgba(255,255,255,.12);border:none;color:rgba(255,255,255,.7);border-radius:var(--r3);padding:3px 8px;font-size:11px;font-weight:600;transition:background var(--trans)}
.role-btn:hover{background:rgba(255,255,255,.2);color:#fff}
.clock-display{text-align:center;padding:4px 0 2px}
.clock-display .time{font-size:18px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.clock-display .date{font-size:11px;color:rgba(255,255,255,.38);font-weight:500;margin-top:1px}
.main-area{margin-left:var(--sidebar);flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 28px;height:58px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;flex-shrink:0}
.page-title{font-size:15px;font-weight:700;color:var(--ink);flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.content{padding:24px 28px 40px;flex:1}
.view{display:none}.view.active{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink2);transition:all var(--trans);white-space:nowrap;cursor:pointer}
.btn:hover{border-color:var(--gray-400);background:var(--gray-50);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy2);border-color:var(--navy2)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.gold:hover{background:var(--gold-dark)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.green:hover{background:var(--green-dark)}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.red:hover{background:var(--red-dark)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:6px}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.card-title{font-size:13.5px;font-weight:700;color:var(--ink)}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
.card-body{padding:16px 20px}
.card-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.kpi-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);padding:18px 20px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi-value{font-family:var(--font-serif);font-size:30px;font-weight:400;color:var(--ink);line-height:1.1;margin-top:6px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.kpi-note{font-size:11.5px;color:var(--faint);margin-top:4px}
.kpi-card.highlight .kpi-value{color:var(--green)}
.kpi-card.gold .kpi-value{color:var(--gold)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;gap:4px;white-space:nowrap}
.badge.green{background:var(--greentint);color:var(--green)}
.badge.red{background:var(--redtint);color:var(--red)}
.badge.orange{background:var(--orangetint);color:var(--amber)}
.badge.blue{background:var(--bluetint);color:var(--blue)}
.badge.gray{background:var(--gray-100);color:var(--muted)}
.badge.gold{background:var(--goldtint);color:var(--amber)}
.badge.navy{background:var(--blue-pale);color:var(--navy)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:12px}
.page-header-left h1{font-family:var(--font-serif);font-size:22px;font-weight:400;color:var(--ink);letter-spacing:-.4px}
.page-header-left p{font-size:13px;color:var(--muted);margin-top:3px}
.page-header-actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--bg);text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--gray-50)}
.tbl td b{color:var(--ink);font-weight:600}
.tbl td .sub{font-size:11px;color:var(--muted);margin-top:1px}
.tbl td.actions{white-space:nowrap;display:flex;gap:5px}

.spacer{height:16px}

@media(max-width:800px){:root{--sidebar:0px}.sidebar{transform:translateX(-240px);transition:transform .25s}.sidebar.open{transform:translateX(0);--sidebar:240px}.main-area{margin-left:0}.kpi-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.field.col3{grid-column:auto}}

/* ===== Design-system convergence: floors + sticky identity column (visual only) ===== */
/* Interactive controls >=44px tap target (button labels keep their type scale via line-height). */

<style id="qms-mobile-style">
/* ===== Mobile responsive layer (<=640px). Desktop bytes above are untouched. ===== */
/* CSS-only nav drawer toggle: hidden on desktop, shown only on small screens */
.qms-menu-toggle{display:none}
.qms-menu-btn,.qms-nav-overlay{display:none}
@media(max-width:640px){
  /* --- Layout shell --- */
  :root{--sidebar:0px}
  body{overflow:auto}
  .main-area{margin-left:0;width:100%;min-width:0}
  .content{padding:16px 14px 32px}
  .topbar{padding:0 14px 0 56px;height:54px}

  /* --- CSS-only drawer (no JS): checkbox drives the off-canvas sidebar --- */
  .qms-menu-btn{
    display:flex;align-items:center;justify-content:center;
    position:fixed;top:9px;left:10px;z-index:60;
    width:44px;height:44px;border-radius:10px;
    background:var(--navy);color:#fff;border:none;cursor:pointer;
    box-shadow:var(--shadow);
  }
  .qms-menu-btn svg{width:20px;height:20px;display:block}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:240px;box-shadow:0 8px 40px rgba(0,0,0,.3)}
  .qms-menu-toggle:checked ~ .sidebar{transform:translateX(0)}
  .qms-menu-toggle:checked ~ .qms-nav-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}

  /* --- Collapse multi-column grids to a single column --- */
  .grid-2,.grid-3,.grid-auto,.form-grid{grid-template-columns:1fr!important}
  .field.col3{grid-column:auto}
  /* small KPI tiles may stay 2-up */
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi-card{padding:14px 14px}
  .kpi-value{font-size:24px;letter-spacing:-.5px}

  /* --- Page header & action rows wrap instead of overflowing --- */
  .page-header{flex-direction:column;align-items:stretch;gap:12px}
  .page-header-actions,.topbar-actions{flex-wrap:wrap}
  .page-header-left h1{font-size:19px}

  /* --- Tables: keep horizontal scroll inside their wrapper, don't squash --- */
  /* grid items / cards must allow shrinking so a 600px min-content table
     scrolls INSIDE .tbl-wrap instead of stretching the whole card off-screen */
  .grid-2>*,.grid-3>*,.grid-auto>*{min-width:0}
  .card{min-width:0}
  .tbl-wrap{max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl{min-width:600px}

  /* --- CRO Master table only: reflow to stacked cards (Reports tables keep scroll) --- */
  #croMasterTbl{min-width:0!important;width:100%;display:block}
  #croMasterTbl thead,#croMasterTbl tfoot{display:none}
  #croMasterTbl tbody{display:block}
  #croMasterTbl tbody tr{display:block;margin:0 0 12px;border:1px solid var(--gray-200,#e5e7eb);border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(13,35,64,.08);overflow:hidden;position:relative}
  #croMasterTbl td.name-cell{position:static!important;display:block;background:var(--navy,#0d2340)!important;box-shadow:none;padding:10px 44px 10px 12px!important;text-align:left!important;width:auto!important}
  #croMasterTbl td.name-cell,#croMasterTbl td.name-cell *{color:#fff!important}
  #croMasterTbl td.gm-del-cell{position:absolute;top:8px;right:8px;border:0!important;padding:0!important;background:transparent!important;display:block;width:auto}
  #croMasterTbl tbody td{display:flex;align-items:center;justify-content:space-between;gap:10px;width:auto!important;text-align:right!important;border:0;border-bottom:1px solid var(--gray-100,#f3f4f6);padding:9px 12px!important;min-height:40px}
  #croMasterTbl tbody tr td:last-child{border-bottom:0}
  #croMasterTbl tbody td::before{content:attr(data-label);flex:0 0 auto;text-align:left;font-size:11px;font-weight:700;color:var(--gray-500,#6b7280);text-transform:uppercase}
  #croMasterTbl td.name-cell::before,#croMasterTbl td.gm-del-cell::before{content:none}
  #croMasterTbl tbody td:empty{display:none}
  #croMasterTbl tbody td input,#croMasterTbl tbody td select{flex:1 1 auto;min-width:0;width:auto!important;min-height:40px}

  /* --- Cards & padding trim --- */
  .card-head{padding:14px 14px 0;flex-wrap:wrap;gap:8px}
  .card-body{padding:14px}
  .card-foot{padding:12px 14px;flex-wrap:wrap}
  .modal-backdrop{padding:12px}
  .modal-foot{flex-wrap:wrap}

  /* --- Audit row: stack the fixed 130px column --- */
  .audit-item{grid-template-columns:1fr auto;gap:6px 10px}
  .audit-time{grid-column:1/-1}

  /* --- Inputs >=16px to stop iOS focus-zoom --- */
  .input,.select,.textarea{font-size:16px;padding:11px 12px}
  .setting-input{max-width:none;width:100%}
  .toggle-row{flex-wrap:wrap;gap:8px}

  /* --- Tap targets: all interactive controls meet the 44px floor. --- */
  .btn{min-height:44px;padding:10px 14px}
  .btn.sm{min-height:44px}
  .btn.xs{min-height:44px}
  .nav-item{min-height:44px}
  .q-actions .btn,.tbl td.actions .btn{min-height:44px}

  /* --- Toast may wrap on narrow screens --- */
  .toast{max-width:92vw;white-space:normal;text-align:center}
}
</style>

<style id="st-v5-uniform-css">
/* No remote @import — app is fully offline (INTERNET permission removed); a render-blocking
   font fetch that can never resolve was a likely cause of module-open stalls. System fonts below. */
/* ── VISIBILITY FIX ── force light rendering so Android WebView dark-mode
   (algorithmic darkening / force-dark) cannot invert text to invisible.
   This is the root cause of "some text not visible" on phones/tablets. */
:root{color-scheme:light only}
html{color-scheme:light only;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif !important;forced-color-adjust:none}
h1,h2,h3,h4,h5,.title,.headline,.brand,.heading{font-family:'DM Serif Display',Georgia,serif !important;letter-spacing:.2px}
/* Don't fight module's own colors — only normalize font + base focus ring */
*:focus-visible{outline:2px solid #b8922a;outline-offset:1px}
button,input,select,textarea{font-family:inherit}
/* keep date/number/select text from going invisible on some Android WebViews */
input,select,textarea{-webkit-text-fill-color:currentColor;opacity:1}
input::placeholder,textarea::placeholder{-webkit-text-fill-color:#7a8699;opacity:1}
/* ── RESPONSIVE SAFETY (tablet + mobile), conservative so module layouts stay intact ── */
img,svg,video,canvas{max-width:100%;height:auto}
*{ -webkit-tap-highlight-color:rgba(184,146,42,.18) }
@media(max-width:920px){
  body{ padding-bottom:72px !important }                 /* clear the back-home FAB + injected gate banner */
  table{ display:block; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch }
  thead,tbody,tr{ width:max-content; min-width:100% }
}
@media(max-width:640px){
  html{ font-size:15px }
  button,.btn,a.btn,[role=button]{ min-height:40px }
  input,select,textarea{ min-height:38px; font-size:16px }   /* 16px stops iOS/Android zoom-on-focus */
}
@media print{ body{background:#fff !important;color:#000 !important} }

/* ════════════════════════════════════════════════════════════════════════
   GLOBAL FLOORS — accessibility minimums applied to EVERY module iframe
   (this block is injected unconditionally, mobile AND desktop). Two rules:
     1. No on-screen text smaller than 11px.
     2. Every interactive control is at least 44x44 with a real tap target.
   These are FLOORS: they only raise values that fall below the minimum, so
   module typography/spacing above the floor is untouched. !important is
   required because module + MOBILE_CSS rules set their own sizes with
   !important (some shrink table/label text to 9px and inputs below 44px).
   ════════════════════════════════════════════════════════════════════════ */
/* 1a — baseline text floor (NOT !important): max(11px,1em) keeps each element's
   inherited/declared size when it is already >=11px, and lifts anything smaller
   to 11px. Because it is low-priority, any module rule that sets a size >=11px
   still wins; this only catches unset or sub-11px text. svg/script/style are
   excluded so we never touch vector or non-rendered nodes. */
html body *:not(svg):not(svg *):not(script):not(style){
  font-size:max(11px, 1em);
}
/* 1b — hard floor (!important) for the small-text leaves that modules + MOBILE_CSS
   deliberately shrink to 9–10px (table cells, chips, captions, *-sub/-meta/-hint
   labels). Flooring these to 11px is the intent of the accessibility minimum.
   These are genuine small-text leaves, so 11px will not distort hierarchy. */
html body small,
html body .h-name,html body th,html body td,
html body .leave-chip,html body .mt,html body .badge,html body .chip,html body .pill,html body .tag,
html body figcaption,html body caption,html body legend,
html body [class*="-sub"],html body [class*="-meta"],html body [class*="-hint"],
html body [class*="-note"],html body [class*="-cap"],html body [class*="-label"],
html body [class*="-time"],html body [class*="-date"]{
  font-size:max(11px, 1em) !important;
}
/* 2 — interactive control floor: 44px min hit area + readable size. Covers
   normal controls AND tiny icon/delete/close/remove buttons that often ship at
   ~24–32px. The [class*=…] matches are scoped to button/a/[role=button] so a
   wrapper div like .delete-modal is never affected. min-width keeps icon-only
   buttons square-ish. */
html body button,
html body input:not([type=hidden]):not([type=checkbox]):not([type=radio]),
html body select,html body textarea,
html body a.btn,html body [role=button],html body label.btn,
html body .btn,html body .icon-btn,html body .iconbtn,
html body button[class*="close"],html body button[class*="delete"],html body button[class*="remove"],
html body button[class*="-del"],html body button[class*="icon"],
html body a[class*="close"],html body a[class*="delete"],html body a[class*="remove"]{
  min-height:44px !important;
  min-width:44px;
}
/* keep checkbox/radio compact but tappable (don't stretch the box itself) */
html body input[type=checkbox],html body input[type=radio]{
  min-width:18px !important;min-height:18px !important;
}
/* inputs/selects inside dense table cells: keep the 44px hit area but allow
   the cell width to drive horizontal size so tables don't blow out. */
html body td button,html body th button,
html body td input,html body th input,
html body td select,html body th select{
  min-width:0;
}
</style>

'SM'}

function save(action, details) {
  const persistence = qmsPersistenceApi();

    qmsRestorePersistedState();
    toast('Save control unavailable. Nothing was changed.', 'error');
    return false;
  }
  const auditEntry = action ? {
    id: uid('aud'),
    at: new Date().toISOString(),
    role,
    action,
    details: details || {}
  } : null;
  if (!persistence.commit(localStorage, STORE_KEY, state, auditEntry, 600)) {
    qmsRestorePersistedState();
    toast('Save failed. Your previous saved data is unchanged; retry when storage is available.', 'error');
    return false;
  }

  return true;
}
function addAudit(action, details = {}, skipSave = false) {
  if (!skipSave) return save(action, details);

setInterval(function(){if(document.hidden)return;if(activeView!=='live'&&activeView!=='dashboard')return;if(!$('modalBackdrop').classList.contains('hidden'))return;const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA'))return;renderAll()},45000);
function currentRotation(){if(isPast())return state.rotations.find(r=>r.date===viewAsOf)||null;return state.rotations.find(r=>r.date===todayISO()&&r.status==='Active')||null}

/* ===== Phase 1: CRO occupancy ("one active lead in hand") =====
   OFF_FLOOR = statuses that pull a CRO off the floor (skip-with-reason path).
   A CRO is FREE only when on-floor, active, manual-status not Busy, AND holding no open lead. */
const OFF_FLOOR_STATUSES=['Washroom','Tea / Lunch Break','Not Near Entrance','Manager Work','Half Day','Inactive'];
const NOT_FREE_STATUSES=OFF_FLOOR_STATUSES.concat(['Busy']);
/* ===== Phase 6: canonical state vocabulary (documentation + reporting aids; NOT enforced/migrated).
   CUSTOMER_STATES is the ordered customer lifecycle. CRO_AVAIL_STATES are the MANUAL availability
   strings; the full CRO status vocabulary = CRO_AVAIL_STATES ∪ OFF_FLOOR_STATUSES. NOTE: 'Busy' here
   is the MANUAL status string, distinct from the DERIVED occupancy computed by croBusy()/isFreeOnFloor().
   'Billing / Service Desk' is a tolerated legacy alias (see statusConfig) — NOT part of CUSTOMER_STATES. */
const CUSTOMER_STATES=['New Entry','Waiting','Allocated','In Discussion','Awaiting Closure','Closed'];
const CRO_AVAIL_STATES=['Available','Busy'];
/* Non-destructive validator/centralization point for reporting. NEVER rewrites a valid value, NEVER
   throws; returns input unchanged when recognized, 'New Entry' only for empty/nullish. NOT wired into
   any setter in p6 (behavior-preserving). */
function normalizeCustomerStatus(s){const v=String(s||'').trim();if(CUSTOMER_STATES.includes(v))return v;if(v==='Billing / Service Desk')return v;/* tolerated legacy alias */return v||'New Entry';}
/* ===== Phase 6: pre-claim READERS (reporting-only; defensive). There is no pre-claim feature in this
   baseline, so these guard for a missing state.preclaims array and return empty/zero gracefully. ===== */
function isPreclaimActive(p){if(!p)return false;const d=(p.date||p.createdAt||'').slice(0,10);return p.status==='Active'&&d===viewAsOf;}
function preclaimsForView(){return(Array.isArray(state.preclaims)?state.preclaims:[]).filter(p=>((p&&(p.date||p.createdAt||''))||'').slice(0,10)===viewAsOf);}
function preclaimStatsByCro(){const map={};preclaimsForView().forEach(p=>{const id=p&&p.croId;if(!id)return;map[id]=map[id]||{honored:0,missed:0};const st=String(p.status||'');if(st==='Honored')map[id].honored++;else if(st==='Missed'||st==='Missed-but-held'||st==='Expired')map[id].missed++;});return map;}
/* ===== Phase 4: Pre-claim engine ("CRO gives name+number → reader enters number → auto-allocate") ===== */
function findActivePreclaim(mobile){return(Array.isArray(state.preclaims)?state.preclaims:[]).find(p=>p&&p.status==='Active'&&p.mobile===mobile&&(p.date||'')===todayISO())||null;}
function routeWithPreclaim(c){const rot=currentRotation();const pc=findActivePreclaim(c.mobile);if(!pc){allocateCustomer(c.id);return;}const croId=pc.croId;const item=rot?rotationItem(rot,croId):null;if(!rot||!item||isOffFloor(item)){/* claimed CRO not on the floor → claim missed (unavailable); normal rotation */pc.status='Missed';pc.honoredCustomerId=null;addAudit('preclaim.missed',{queueNo:c.queueNo,croId,croName:croName(croId),reason:'unavailable'},true);allocateCustomer(c.id);return;}if(isFreeOnFloor(rot,croId)){/* HONOR — bonus: assign directly, no pointer advance, no rotation turn consumed */c.expectedCroId=rot.currentCroId;c.assignedCroId=croId;c.allocatedTime=new Date().toISOString();c.status='Allocated';pc.status='Honored';pc.honoredCustomerId=c.id;addAudit('preclaim.honored',{queueNo:c.queueNo,croId,croName:croName(croId)},true);return;}/* claimed CRO on-floor but BUSY → this customer goes to rotation now; hold the CRO as next-opportunity */pc.status='Missed-but-held';pc.honoredCustomerId=null;rot.priorityCroId=croId;addAudit('preclaim.missed',{queueNo:c.queueNo,croId,croName:croName(croId),reason:'busy-held'},true);allocateCustomer(c.id);}
function savePreclaim() {
  if (!guardWrite()) return;
  const croId = $('pcCro') ? $('pcCro').value : '';
  const name = $('pcName').value.trim();
  const mobile = $('pcMobile').value.trim();
  const note = $('pcNote') ? $('pcNote').value.trim() : '';
  if (!croId) {
    toast('Select a CRO.', 'error');
    return;
  }
  if (!name) {
    toast('Customer name required.', 'error');
    return;
  }
  if (!/^\d{10}$/.test(mobile)) {
    toast('Mobile must be 10 digits.', 'error');
    return;
  }
  const existing = findActivePreclaim(mobile);
  if (existing) {
    toast('Already pre-claimed by ' + croName(existing.croId) + '.', 'error');
    return;
  }
  state.preclaims.push({
    id: uid('pc'),
    croId,
    customerName: name,
    mobile,
    note,
    createdAt: new Date().toISOString(),
    createdBy: role,
    date: todayISO(),
    status: 'Active',
    honoredCustomerId: null
  });
  if (!save('preclaim.create', { croId, croName: croName(croId) })) {
    if ($('pcCro')) $('pcCro').value = croId;
    if ($('pcName')) $('pcName').value = name;
    if ($('pcMobile')) $('pcMobile').value = mobile;
    if ($('pcNote')) $('pcNote').value = note;
    return;
  }
  ['pcName', 'pcMobile'].forEach(id => {
    if ($(id)) $(id).value = '';
  });
  if ($('pcNote')) $('pcNote').value = '';
  toast('Pre-claim added for ' + croName(croId) + '.', 'success');

      !state.customers.some(customer => customer && customer.id === existing.customerId)) {

function confirmCloseLead(id) {

  const c = customerById(id);
  if (!c) return;
  const out = $('closeOutcome').value;
  const followupRequired = $('fuReq').value === 'Yes';
  if (followupRequired && !c.mobile) {
    toast('Cannot set a follow-up without a mobile number.', 'error');
    return;
  }

  const staged = {};
  if (out === 'Purchase') {
    const bill = $('billNo').value.trim();
    const amount = Number($('purchaseAmount').value);
    if (state.settings.requireBillForPurchase && !bill) {
      toast('Bill number required.', 'error');
      return;
    }
    if (!Number.isFinite(amount) || amount <= 0) {
      toast('Purchase amount must be greater than zero.', 'error');
      return;
    }
    const reason = qmsValidateOutcome('Purchase', {
      conversionReasonCode: $('conversionReasonCode').value,
      reasonDetail: $('conversionReasonDetail').value
    });
    if (!reason.ok) {
      toast(reason.message, 'error');
      return;
    }
    Object.assign(staged, {
      billNo: bill,
      purchaseAmount: amount,
      purchaseCategory: $('purchaseCategory').value.trim(),
      paymentMode: $('paymentMode').value,
      conversionReasonCode: reason.reasonCode,
      conversionReason: reason.reasonLabel,
      conversionReasonDetail: reason.reasonDetail
    });
  }
  if (out === 'Service') {
    const job = $('jobCardNo').value.trim();
    if (state.settings.requireJobForService && !job) {
      toast('Job card required.', 'error');
      return;
    }
    Object.assign(staged, {
      jobCardNo: job,
      serviceType: $('serviceType').value,
      deliveryDate: $('deliveryDate').value,
      advance: +$('advance').value || 0
    });
  }
  if (out === 'Non Purchase') {
    const reason = qmsValidateOutcome('Non Purchase', {
      lostReasonCode: $('lostReasonCode').value,
      reasonDetail: $('lostReasonDetail').value
    });
    if (!reason.ok) {
      toast(reason.message, 'error');
      return;
    }
    const lostValue = Number($('lostValue').value || 0);
    if (!Number.isFinite(lostValue) || lostValue < 0) {
      toast('Estimated lost value must be zero or more.', 'error');
      return;
    }
    Object.assign(staged, {
      lostReasonCode: reason.reasonCode,
      lostReason: reason.reasonLabel,
      lostReasonDetail: reason.reasonDetail,
      lostValue
    });
  }

  let followupDraft = null;
  if (followupRequired) {
    const dueDate = $('followDate').value;
    if (!dueDate) {
      toast('Follow-up date required.', 'error');
      return;
    }
    let expectedValue = Number($('followExpectedValue').value || 0);
    if (!Number.isFinite(expectedValue) || expectedValue < 0) {
      toast('Expected value must be zero or more.', 'error');
      return;
    }
    if (!expectedValue && out === 'Non Purchase') expectedValue = staged.lostValue || 0;
    followupDraft = {
      id: uid('fu'),
      customerId: c.id,
      queueNo: c.queueNo,
      customerName: c.name,
      mobile: c.mobile,
      croId: c.assignedCroId,
      dueDate,
      expectedValue,
      lastContactAt: null,
      contactCount: 0,
      mode: $('followMode').value,
      notes: $('followNotes').value.trim(),
      status: 'Pending',
      createdAt: new Date().toISOString()
    };
  }

  Object.assign(c, staged);
  if (followupDraft) state.followups.push(followupDraft);
  c.outcome = out;
  c.notes = $('closeNotes').value.trim();
  c.closedAt = new Date().toISOString();
  c.closedBy = role;
  c.status = 'Closed';
  if (!c.exitTime) c.exitTime = new Date().toISOString();
  tryFillFromWaiting();
  if (!save('lead.close', { queueNo: c.queueNo, outcome: out, followup: followupRequired, reasonCode: staged.lostReasonCode || staged.conversionReasonCode || null })) return;
  closeModal();
  toast('Lead closed.', 'success');
}

function rangeStats(days){const since=new Date();since.setDate(since.getDate()-days+1);/* Audit fix qms-bug-01: zero time-of-day so the oldest day's early entries aren't dropped (compare by local date start, not raw ms) */since.setHours(0,0,0,0);return calcStats(state.customers.filter(c=>new Date(c.entryTime)>=since))}
function reportCard(title,s){return`<div class="report-card"><h4>${title}</h4><div class="report-row"><span class="rk">Walk-ins</span><span class="rv">${s.total}</span></div><div class="report-row"><span class="rk">Purchase / Service / Non</span><span class="rv">${s.pur} / ${s.svc} / ${s.non}</span></div><div class="report-row"><span class="rk">Sales</span><span class="rv">₹${s.sales.toLocaleString('en-IN')}</span></div><div class="report-row"><span class="rk">Conversion</span><span class="rv">${s.conv}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,s.conv)}%"></div></div></div>`}
function croPerfRows(rot){const pcMap=preclaimStatsByCro();return state.cros.filter(c=>c.active).map(c=>{const list=todaysCustomers().filter(x=>x.assignedCroId===c.id),pur=list.filter(x=>x.outcome==='Purchase'),skips=(rot?.turnEvents||[]).filter(e=>e.expectedCroId===c.id).length;const turns=todaysCustomers().filter(x=>x.assignedCroId===c.id&&x.expectedCroId===c.id).length;const pc=pcMap[c.id]||{honored:0,missed:0};const off=rot?isOffFloor(rotationItem(rot,c.id)):false;const free=rot?isFreeOnFloor(rot,c.id):false;const now=off?{cls:'gray',txt:'Off floor'}:(!free?{cls:'blue',txt:'Busy'}:{cls:'green',txt:'Free'});return{name:c.name,turns,total:list.length,pur:pur.length,sales:pur.reduce((s,x)=>s+(+x.purchaseAmount||0),0),conv:list.length?Math.round(pur.length/list.length*100):0,skips,pcHonored:+pc.honored||0,pcMissed:+pc.missed||0,now}})}
function croPerformanceTable(){const rot=currentRotation();const rows=croPerfRows(rot);return`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>CRO</th><th>Turns</th><th>Assigned</th><th>Purchases</th><th>Conversion</th><th>Sales</th><th>Skipped</th><th>Pre-claims ✓</th><th>Pre-claims ✗</th><th>Now</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.turns}</td><td>${r.total}</td><td>${r.pur}</td><td>${r.conv}%</td><td>₹${r.sales.toLocaleString('en-IN')}</td><td>${r.skips>0?`<span class="badge orange">${r.skips}</span>`:r.skips}</td><td>${r.pcHonored>0?`<span class="badge green">${r.pcHonored}</span>`:'—'}</td><td>${r.pcMissed>0?`<span class="badge orange">${r.pcMissed}</span>`:'—'}</td><td><span class="badge ${r.now.cls}">${r.now.txt}</span></td></tr>`).join('')}</tbody></table></div>`}
function lostReasonReport(){const rows={};state.customers.filter(c=>c.outcome==='Non Purchase').forEach(c=>rows[c.lostReason||'Not specified']=(rows[c.lostReason||'Not specified']||0)+1);const max=Math.max(1,...Object.values(rows)),items=Object.entries(rows).sort((a,b)=>b[1]-a[1]);if(!items.length)return'<div class="empty-state"><p>No non-purchase cases yet</p></div>';return items.map(([k,v])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12.5px;font-weight:500;color:var(--ink2)">${esc(k)}</span><span style="font-size:12px;font-weight:700;color:var(--ink)">${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%;background:var(--gold)"></div></div></div>`).join('')}
/* ===== V6 Wave 1: Lost ₹ KPI — renders lostValue/lostReason already captured on Non Purchase
   closures (confirmCloseLead). Totals come from calcStats' additive lost field (same Today/7d/31d
   windows as the report cards); top lost leads = highest lostValue in the last 31 days. Render-only. ===== */
function lostValueReport(d,w,m){const since=new Date();since.setDate(since.getDate()-30);const top=state.customers.filter(c=>c.outcome==='Non Purchase'&&(+c.lostValue||0)>0&&new Date(c.entryTime)>=since).sort((a,b)=>(+b.lostValue||0)-(+a.lostValue||0)).slice(0,5);return`<div class="report-row"><span class="rk">Today</span><span class="rv">₹${d.lost.toLocaleString('en-IN')}</span></div><div class="report-row"><span class="rk">Last 7 Days</span><span class="rv">₹${w.lost.toLocaleString('en-IN')}</span></div><div class="report-row"><span class="rk">Last 31 Days</span><span class="rv">₹${m.lost.toLocaleString('en-IN')}</span></div>${top.length?`<div style="margin-top:12px"><div style="font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px">Top Lost Leads · last 31 days</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Mobile</th><th>Lost ₹</th><th>Reason</th></tr></thead><tbody>${top.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="mono">${esc(c.mobile||'—')}</td><td>₹${(+c.lostValue||0).toLocaleString('en-IN')}</td><td>${esc(c.lostReason||'Not specified')}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state" style="margin-top:8px"><p>No lost value recorded yet</p></div>'}`}
/* ===== Phase 6: Skip-reason analytics — buckets today's turnEvents (skipped:true) by reason.
   View-date correct: currentRotation() resolves to the viewAsOf day's rotation. Render-only. ===== */
function skipReasonReport(){const rot=currentRotation();const ev=(rot&&Array.isArray(rot.turnEvents))?rot.turnEvents:[];const rows={};ev.filter(e=>e&&e.skipped).forEach(e=>{const k=e.reason||'Not specified';rows[k]=(rows[k]||0)+1;});const items=Object.entries(rows).sort((a,b)=>b[1]-a[1]);if(!items.length)return'<div class="empty-state"><p>No skips recorded today</p></div>';const max=Math.max(1,...items.map(x=>x[1]));return items.map(([k,v])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12.5px;font-weight:500;color:var(--ink2)">${esc(k)}</span><span style="font-size:12px;font-weight:700;color:var(--ink)">${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%;background:var(--gold)"></div></div></div>`).join('')}
/* ===== Phase 6: Waiting / service summary — queue pressure today. Wait-time math counts only
   customers with attendStart (consistent with calcStats); currentlyWaiting counts status==='Waiting'
   even without attendStart, so the two reconcile separately. avgWait reuses calcStats(). ===== */
function waitingSummary(){const list=todaysCustomers();const waits=list.filter(c=>c.attendStart).map(c=>minsBetween(c.entryTime,c.attendStart));const maxWait=waits.length?Math.max(...waits):0;const currentlyWaiting=list.filter(c=>c.status==='Waiting').length;return{total:list.length,currentlyWaiting,maxWait,avgWait:calcStats(list).avgWait};}
function waitingSummaryCard(){const s=waitingSummary();return`<div class="report-row"><span class="rk">Walk-ins today</span><span class="rv">${+s.total||0}</span></div><div class="report-row"><span class="rk">Currently waiting</span><span class="rv">${+s.currentlyWaiting||0}</span></div><div class="report-row"><span class="rk">Max wait (min)</span><span class="rv">${+s.maxWait||0}</span></div><div class="report-row"><span class="rk">Avg wait (min)</span><span class="rv">${+s.avgWait||0}</span></div>`;}
/* ===== Print bridge: rebuilds the Reports view as a self-contained .stp-* print document.
   Reuses module data (calcStats / rangeStats / croPerformanceTable's source / lostReasonReport's
   source / skipReasonReport's source / waitingSummary). Markup is rebuilt with shared theme classes. ===== */
function printReports(){
  const daily=calcStats(),weekly=rangeStats(7),monthly=rangeStats(31);
  const inr=n=>'₹'+(+n||0).toLocaleString('en-IN');
  // ---- summary cards (mirror reportCard figures) ----
  const card=(title,s)=>`<div class="stp-card"><h4>${stEsc(title)}</h4>`+
    `<div class="v">${stEsc(s.total)}</div>`+
    `<div class="stp-mut">Walk-ins</div>`+
    `<div class="stp-mut">P/S/N: ${stEsc(s.pur)} / ${stEsc(s.svc)} / ${stEsc(s.non)}</div>`+
    `<div class="stp-mut">Sales: ${stEsc(inr(s.sales))}</div>`+
    `<div class="stp-mut">Conversion: ${stEsc(s.conv)}%</div></div>`;
  const cards=`<div class="stp-cards">${card('Today',daily)}${card('Last 7 Days',weekly)}${card('Last 31 Days',monthly)}</div>`;
  // ---- CRO performance (today) — rebuild rows from same source as croPerformanceTable() ----
  const pcMap=preclaimStatsByCro();const rot=currentRotation();
  const croRows=state.cros.filter(c=>c.active).map(c=>{
    const list=todaysCustomers().filter(x=>x.assignedCroId===c.id);
    const pur=list.filter(x=>x.outcome==='Purchase');
    const skips=(rot&&rot.turnEvents?rot.turnEvents:[]).filter(e=>e.expectedCroId===c.id).length;
    const turns=todaysCustomers().filter(x=>x.assignedCroId===c.id&&x.expectedCroId===c.id).length;
    const pc=pcMap[c.id]||{honored:0,missed:0};
    const off=rot?isOffFloor(rotationItem(rot,c.id)):false;
    const free=rot?isFreeOnFloor(rot,c.id):false;
    const now=off?'Off floor':(!free?'Busy':'Free');
    return{name:c.name,turns,total:list.length,pur:pur.length,sales:pur.reduce((s,x)=>s+(+x.purchaseAmount||0),0),conv:list.length?Math.round(pur.length/list.length*100):0,skips,pcHonored:+pc.honored||0,pcMissed:+pc.missed||0,now};
  });
  const croBody=croRows.length?croRows.map(r=>`<tr><td class="stp-c">${stEsc(r.name)}</td><td class="stp-r">${stEsc(r.turns)}</td><td class="stp-r">${stEsc(r.total)}</td><td class="stp-r">${stEsc(r.pur)}</td><td class="stp-r">${stEsc(r.conv)}%</td><td class="stp-r">${stEsc(inr(r.sales))}</td><td class="stp-r">${stEsc(r.skips)}</td><td class="stp-r">${stEsc(r.pcHonored)}</td><td class="stp-r">${stEsc(r.pcMissed)}</td><td class="stp-c">${stEsc(r.now)}</td></tr>`).join(''):`<tr><td class="stp-c" colspan="10"><span class="stp-mut">No active CROs</span></td></tr>`;
  const croSec=`<div class="stp-sec"><div class="stp-sec-t">CRO Performance (Today)</div><table class="stp-table"><thead><tr><th>CRO</th><th class="stp-r">Turns</th><th class="stp-r">Assigned</th><th class="stp-r">Purchases</th><th class="stp-r">Conversion</th><th class="stp-r">Sales</th><th class="stp-r">Skipped</th><th class="stp-r">Pre-claims ✓</th><th class="stp-r">Pre-claims ✗</th><th>Now</th></tr></thead><tbody>${croBody}</tbody></table></div>`;
  // ---- Non-purchase reasons — same source as lostReasonReport() ----
  const lostMap={};state.customers.filter(c=>c.outcome==='Non Purchase').forEach(c=>{const k=c.lostReason||'Not specified';lostMap[k]=(lostMap[k]||0)+1;});
  const lostItems=Object.entries(lostMap).sort((a,b)=>b[1]-a[1]);
  const lostBody=lostItems.length?lostItems.map(([k,v])=>`<tr><td class="stp-c">${stEsc(k)}</td><td class="stp-r">${stEsc(v)}</td></tr>`).join(''):`<tr><td class="stp-c" colspan="2"><span class="stp-mut">No non-purchase cases yet</span></td></tr>`;
  const lostSec=`<div class="stp-sec"><div class="stp-sec-t">Non-Purchase Reasons</div><table class="stp-table"><thead><tr><th>Reason</th><th class="stp-r">Count</th></tr></thead><tbody>${lostBody}</tbody></table></div>`;
  // ---- Skip reasons — same source as skipReasonReport() ----
  const skEv=(rot&&Array.isArray(rot.turnEvents))?rot.turnEvents:[];const skMap={};
  skEv.filter(e=>e&&e.skipped).forEach(e=>{const k=e.reason||'Not specified';skMap[k]=(skMap[k]||0)+1;});
  const skItems=Object.entries(skMap).sort((a,b)=>b[1]-a[1]);
  const skBody=skItems.length?skItems.map(([k,v])=>`<tr><td class="stp-c">${stEsc(k)}</td><td class="stp-r">${stEsc(v)}</td></tr>`).join(''):`<tr><td class="stp-c" colspan="2"><span class="stp-mut">No skips recorded today</span></td></tr>`;
  const skSec=`<div class="stp-sec"><div class="stp-sec-t">Skip Reasons (Today)</div><table class="stp-table"><thead><tr><th>Reason</th><th class="stp-r">Count</th></tr></thead><tbody>${skBody}</tbody></table></div>`;
  // ---- Waiting summary — same source as waitingSummaryCard() ----
  const ws=waitingSummary();
  const wsSec=`<div class="stp-sec"><div class="stp-sec-t">Waiting & Service Summary (Today)</div><table class="stp-table"><tbody>`+
    `<tr><td class="stp-c">Walk-ins today</td><td class="stp-r">${stEsc(+ws.total||0)}</td></tr>`+
    `<tr><td class="stp-c">Currently waiting</td><td class="stp-r">${stEsc(+ws.currentlyWaiting||0)}</td></tr>`+
    `<tr><td class="stp-c">Max wait (min)</td><td class="stp-r">${stEsc(+ws.maxWait||0)}</td></tr>`+
    `<tr><td class="stp-c">Avg wait (min)</td><td class="stp-r">${stEsc(+ws.avgWait||0)}</td></tr>`+
    `</tbody></table></div>`;
  const store=(state.settings&&state.settings.storeName)||'Saagar Traders';
  const head=`<div class="stp-head"><div class="stp-brand">Saagar Traders<small>Queue Management</small></div><div class="stp-title">QMS Report<small>Daily / Weekly / Monthly Report</small></div></div>`+
    `<div class="stp-meta"><span>Store: ${stEsc(store)}</span> · <span>As of: ${stEsc(viewAsOf)}</span> · <span>Generated: ${stEsc(new Date().toLocaleString('en-IN'))}</span></div>`;
  const body=head+cards+croSec+lostSec+skSec+wsSec+`<div class="stp-foot">Generated by QMS · Saagar Traders</div>`;
  stPrintDoc({title:'QMS Reports',fileBase:'QMS-Reports',body,orientation:'portrait'});
}
function renderSettings(){$('view-settings').innerHTML=`<div class="page-header"><div class="page-header-left"><h1>Settings</h1><p>System configuration, data management and CRO master list</p></div></div><div class="grid-2" style="margin-bottom:16px"><div class="card"><div class="card-head"><div><div class="card-title">Store & Queue Settings</div></div></div><div class="card-body">${settingRows()}</div></div><div class="card"><div class="card-head"><div><div class="card-title">Data & Backup</div></div></div><div class="card-body"><div class="toggle-row"><div class="toggle-info"><strong>Records</strong><span>${state.customers.length} customers, ${state.followups.length} follow-ups, ${state.audit.length} audit logs</span></div></div><div class="toggle-row"><div class="toggle-info"><strong>Last Backup</strong><span>${state.lastBackup?fmtDT(state.lastBackup):'Never'}</span></div></div></div><div class="card-foot"><button class="btn green" onclick="backupData()">Download Backup</button><button class="btn gold" onclick="$('restoreInput').click()">Restore</button><button class="btn" style="color:var(--red);border-color:#fca5a5;margin-left:auto" onclick="resetDemo()">Reset All</button></div></div></div><div class="card"><div class="card-head"><div><div class="card-title">CRO Master</div><div class="card-sub">Active CROs available for daily rotation</div></div><button class="btn primary" onclick="addCroToMaster()">Add CRO</button></div><div class="card-body" style="padding:0">${croMasterTable()}</div></div>`}
function settingRows(){const s=state.settings,rows=[['storeName','Store Name','text'],['ownerWhatsApp','Owner WhatsApp (10-digit)','text'],['queuePrefix','Queue Number Prefix','text'],['waitAlertMins','Waiting Alert (minutes)','number'],['autoAllocate','Auto-allocate CRO by rotation','bool'],['requireBillForPurchase','Bill No. required for Purchase','bool'],['requireJobForService','Job Card required for Service','bool'],['allowGreeterClose','Allow Greeter to close leads','bool'],['smCanGiveNextOpportunity','SM can give next opportunity','bool'],['lockEditsAfterEOD','Lock edits after EOD','bool']];return rows.map(([key,label,type])=>`<div class="toggle-row"><div class="toggle-info"><strong>${label}</strong>${type!=='bool'?`<span>${esc(String(s[key]))}</span>`:''}</div>${type==='bool'?`<label class="switch"><input type="checkbox" ${s[key]?'checked':''} onchange="updateSetting('${key}',this.checked)"><div class="switch-track"></div><div class="switch-thumb"></div></label>`:`<input class="input setting-input" type="${type}" value="${esc(s[key])}" onchange="updateSetting('${key}',this.value)">`}</div>`).join('')}
function updateSetting(key, value) {
  if (!guardPast()) return false;
  if (!requireSM()) return false;
  if (key === 'waitAlertMins') value = +value || 10;
  state.settings[key] = value;
  return save('settings.update', { key, value });
}
function croMasterTable(){return`<div class="tbl-wrap"><table class="tbl" id="croMasterTbl"><thead><tr><th>Name</th><th>Code</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.cros.map(c=>`<tr><td class="name-cell" data-label="Name"><b>${esc(c.name)}</b></td><td class="mono" data-label="Code" style="font-size:12px">${esc(c.code||'—')}</td><td data-label="Status"><span class="badge ${c.active?'green':'red'}">${c.active?'Active':'Inactive'}</span></td><td class="gm-del-cell" data-label="Actions"><div style="display:flex;gap:5px"><button class="btn sm" onclick="editCro('${c.id}')">Edit</button><button class="btn sm" style="color:${c.active?'var(--red)':'var(--green)'};border-color:${c.active?'#fca5a5':'#a7f3d0'}" onclick="toggleCro('${c.id}')">${c.active?'Deactivate':'Activate'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function editCro(id){if(!guardPast())return;const c=state.cros.find(x=>x.id===id);if(!c)return;openModal('Edit CRO',`<div class="field full" style="margin-bottom:12px"><label class="label">Name</label><input class="input" id="editCroName" value="${esc(c.name)}"></div><div class="field full"><label class="label">Code</label><input class="input" id="editCroCode" value="${esc(c.code||'')}"></div>`,`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmEditCro('${id}')">Save</button>`,true)}
function confirmEditCro(id){if(!guardPast())return;const c=state.cros.find(x=>x.id===id);if(!c)return;c.name=$('editCroName').value.trim()||c.name;c.code=$('editCroCode').value.trim();if(!save('cro.edit',{id}))return;closeModal();toast('CRO updated.','success')}
function toggleCro(id){if(!guardPast())return;if(!requireSM())return;const c=state.cros.find(x=>x.id===id);if(!c)return;c.active=!c.active;if(!save('cro.toggle',{id,active:c.active}))return;toast(`${c.name} ${c.active?'activated':'deactivated'}.`)}
function backupData(){if(!guardPast())return;state.lastBackup=new Date().toISOString();localStorage.setItem(STORE_KEY,JSON.stringify(state));const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});if(window.parent&&window.parent!==window){window.parent.postMessage({type:'ST_SHARE',file:blob,fileName:`qms-backup-${todayISO()}.json`,title:'QMS backup',exportId:'qms-backup-export',scopeId:'qms-full-state',scopeLabel:'QMS full-state backup',rowCount:state.customers.length,purposeId:'business-continuity'},'*');renderAll();return}toast('Controlled export is available only inside Saagar Control Centre.','error')}
function restoreData(file){if(!guardPast())return;if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.settings||!Array.isArray(data.customers))throw new Error('Invalid');state=data;localStorage.setItem(STORE_KEY,JSON.stringify(state));load();renderAll();toast('Backup restored.','success')}catch(e){toast('Invalid backup file.','error')}};r.readAsText(file)}
function resetDemo(){if(!guardPast())return;if(!requireSM())return;if(!confirm('Delete all QMS data in this browser? This cannot be undone.'))return;state=initialState();localStorage.setItem(STORE_KEY,JSON.stringify(state));load();renderAll();toast('System reset.','warn')}
function closeEOD(){if(!guardPast())return;if(!requireSM())return;if(!currentRotation()){toast("No active rotation to close.","warn");return;}const rot=currentRotation(),open=todaysCustomers().filter(c=>c.status!=='Closed');if(open.length&&!confirm(`${open.length} lead(s) still open. Close EOD anyway?`))return;rot.status='Closed';rot.closedAt=new Date().toISOString();rot.closedBy=role;state.preclaims.forEach(p=>{if(p&&p.status==='Active'&&(p.date||'')===todayISO())p.status='Expired';});if(!save('eod.close',{date:todayISO(),open:open.length}))return;toast('EOD closed.','success');offerEodShare()}
/* ===== W2-7: EOD owner summary — one-tap share of the day's pulse (PDF via the shell SaagarReport
   engine, payroll ST_REPORT pattern; plus a wa.me plain-text quick send). READ-ONLY: every number
   comes from the SAME functions the Dashboard/Reports render — calcStats() for the KPI row and
   croPerfRows() (extracted from the Reports CRO Performance table) for the per-CRO table; lost
   reasons group the exact list calcStats' lost field sums (todaysCustomers, outcome Non Purchase).
   Not in RO_MUTATORS by design: re-sharing a past or already-closed day is allowed. ===== */
function rotationForSummary(){const rots=state.rotations.filter(r=>r.date===viewAsOf);return rots.find(r=>r.status==='Active')||rots[rots.length-1]||null}
function eodLostReasons(){const m={};todaysCustomers().filter(c=>c.outcome==='Non Purchase').forEach(c=>{const k=c.lostReason||'Not specified';if(!m[k])m[k]={reason:k,count:0,value:0};m[k].count++;m[k].value+=(+c.lostValue||0)});return Object.values(m).sort((a,b)=>b.count-a.count)}
function eodSummaryData(){const s=calcStats();const rot=rotationForSummary();const rows=croPerfRows(rot);return{date:viewAsOf,store:(state.settings&&state.settings.storeName)||'Saagar Traders',closedAt:(rot&&rot.closedAt)||null,closedBy:(rot&&rot.closedBy)||null,kpi:{walkins:s.total,purchases:s.pur,service:s.svc,non:s.non,conv:s.conv,sales:s.sales,lost:s.lost,avgWait:s.avgWait},lostReasons:eodLostReasons(),cros:rows.map(r=>({name:r.name,turns:r.turns,assigned:r.total,purchases:r.pur,conv:r.conv,sales:r.sales,skips:r.skips}))}}
function shareEodSummary(){try{const opts=eodSummaryData();if(window.parent&&window.parent!==window){window.parent.postMessage({type:'ST_REPORT',reportType:'qmsEodSummary',opts:opts},'*');return;}if(window.SaagarReport&&window.SaagarReport.preview){window.SaagarReport.preview('qmsEodSummary',opts);return;}toast('Report engine unavailable on this build.','error');}catch(e){toast('Could not open summary: '+((e&&e.message)||e),'error');}}
function waEodSummary(){try{const d=eodSummaryData();const L=['*'+d.store+' — Day Summary ('+d.date+')*','Walk-ins: '+d.kpi.walkins+' | Purchases: '+d.kpi.purchases+' ('+d.kpi.conv+'%)','Sales: ₹'+d.kpi.sales.toLocaleString('en-IN'),'Lost: ₹'+d.kpi.lost.toLocaleString('en-IN')+(d.lostReasons[0]?' | Top: '+d.lostReasons[0].reason+' ('+d.lostReasons[0].count+')':'')];if(d.cros.length){L.push('');L.push('*CRO performance*');d.cros.forEach(r=>L.push(r.name+': '+r.turns+' turns, '+r.purchases+' buy ('+(r.assigned?r.conv+'%':'—')+'), ₹'+r.sales.toLocaleString('en-IN')+(r.skips?', '+r.skips+' skip(s)':'')));}const digits=qmsTel10((state.settings&&state.settings.ownerWhatsApp)||'');const url=digits?('https://wa.me/91'+digits+'?text='):('https://wa.me/?text=');qmsWaLink(url+encodeURIComponent(L.join('\n')),'qms-eod-summary','owner-operational-summary');}catch(e){toast('Could not build summary text.','error');}}
