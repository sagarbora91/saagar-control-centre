   (this block is injected unconditionally, mobile AND desktop). Two rules:

   module typography/spacing above the floor is untouched. !important is

  function todayIso(){ var d=new Date();function p(n){return(n<10?'0':'')+n;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function uid(){ return 'fest_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6); }
  function inr(n){ return '₹'+Math.round(Number(n)||0).toLocaleString('en-IN'); }
  function val(id){ var e=document.getElementById(id); return e?e.value:''; }
  function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast on'; clearTimeout(t._t); t._t=setTimeout(function(){t.className='toast';},2200); }
  function getCal(){ var c=L(KEY,null); if(!c||typeof c!=='object'||!Array.isArray(c.festivals)) c={version:1,festivals:[]}; return c; }
  function saveCal(c){ c.version=1; S(KEY,c); }

  // Live actual sales from QMS purchases whose close/entry date falls inside [start,end].
  function actualFor(start,end){
    if(!start||!end) return 0;
    var q=L(QMS,null); var arr=(q&&Array.isArray(q.customers))?q.customers:[]; var sum=0;
    arr.forEach(function(c){ if(!c||c.outcome!=='Purchase') return; var d=String(c.closedAt||c.exitTime||c.entryTime||'').slice(0,10); if(d&&d>=start&&d<=end) sum+=Number(c.purchaseAmount)||0; });
    return sum;
  }
  function daysUntil(iso){ try{ var a=new Date(iso+'T00:00:00'),b=new Date(todayIso()+'T00:00:00'); return Math.round((a-b)/86400000); }catch(e){ return null; } }
  function statusBadge(f){
    var t=todayIso();
    if(f.end && t>f.end) return '<span class="badge">Past</span>';
    if(f.start && f.end && t>=f.start && t<=f.end) return '<span class="badge active">Active now</span>';
    var du=f.start?daysUntil(f.start):null;
    if(du!=null && du>=0) return '<span class="badge soon">In '+du+' day'+(du===1?'':'s')+'</span>';
    return '';
  }

  function saveFestival(){
    var name=(val('f_name')||'').trim(), start=val('f_start'), end=val('f_end');
    if(!name){ toast('Name is required'); return; }
    if(!start||!end){ toast('Start and end dates are required'); return; }
    if(end<start){ toast('End date is before start'); return; }
    var c=getCal(), id=val('f_id');
    var rec={ id:id||uid(), name:name, start:start, end:end,
      targets:{ titanworld:Number(val('f_tt'))||0, helios:Number(val('f_th'))||0 },
      note:(val('f_note')||'').trim(), blackout:document.getElementById('f_black').checked, checklist:[] };
    if(id){ var i=c.festivals.findIndex(function(x){return x.id===id;}); if(i>-1){ rec.checklist=c.festivals[i].checklist||[]; c.festivals[i]=rec; } else c.festivals.push(rec); }
    else c.festivals.push(rec);
    saveCal(c); resetForm(); toast('Saved'); render();
  }
  function editFestival(id){
    var f=getCal().festivals.find(function(x){return x.id===id;}); if(!f) return;
    document.getElementById('f_id').value=f.id; document.getElementById('f_name').value=f.name||'';
    document.getElementById('f_start').value=f.start||''; document.getElementById('f_end').value=f.end||'';
    document.getElementById('f_tt').value=(f.targets&&f.targets.titanworld)||''; document.getElementById('f_th').value=(f.targets&&f.targets.helios)||'';
    document.getElementById('f_note').value=f.note||''; document.getElementById('f_black').checked=!!f.blackout;
    document.getElementById('formTitle').textContent='Edit — '+f.name;
    window.scrollTo(0,0);
  }
  function resetForm(){ ['f_id','f_name','f_start','f_end','f_tt','f_th','f_note'].forEach(function(id){ var e=document.getElementById(id); if(e) e.value=''; }); document.getElementById('f_black').checked=false; document.getElementById('formTitle').textContent='Add a festival / season'; }
  function delFestival(id){ if(!confirm('Delete this festival?')) return; var c=getCal(); c.festivals=c.festivals.filter(function(x){return x.id!==id;}); saveCal(c); toast('Deleted'); render(); }
  function addChkItem(id){ var t=(val('ck_'+id)||'').trim(); if(!t) return; var c=getCal(); var f=c.festivals.find(function(x){return x.id===id;}); if(!f) return; f.checklist=f.checklist||[]; f.checklist.push({text:t,done:false}); saveCal(c); render(); }
  function toggleChk(id,idx){ var c=getCal(); var f=c.festivals.find(function(x){return x.id===id;}); if(!f||!f.checklist[idx]) return; f.checklist[idx].done=!f.checklist[idx].done; saveCal(c); render(); }
  function delChk(id,idx){ var c=getCal(); var f=c.festivals.find(function(x){return x.id===id;}); if(!f) return; f.checklist.splice(idx,1); saveCal(c); render(); }

  function render(){
    var c=getCal();
    var fests=c.festivals.slice().sort(function(a,b){ return String(a.start).localeCompare(String(b.start)); });
    var t=todayIso();
    // upcoming/active first, past last
    fests.sort(function(a,b){ var ap=(a.end&&t>a.end)?1:0, bp=(b.end&&t>b.end)?1:0; if(ap!==bp) return ap-bp; return String(a.start).localeCompare(String(b.start)); });
    var host=document.getElementById('list');
    if(!fests.length){ host.innerHTML='<div class="card"><div class="empty">No festivals planned yet. Add Dhanteras or Diwali above to set targets and a prep checklist.</div></div>'; return; }
    host.innerHTML=fests.map(function(f){
      var past=f.end&&t>f.end;
      var tgt=((f.targets&&f.targets.titanworld)||0)+((f.targets&&f.targets.helios)||0);
      var act=actualFor(f.start,f.end);
      var pct=tgt>0?Math.min(100,Math.round(act/tgt*100)):0;
      var chk=(f.checklist||[]);
      var done=chk.filter(function(x){return x.done;}).length;
      var chkHtml=chk.map(function(x,i){ return '<div class="chk"><input type="checkbox" '+(x.done?'checked':'')+' onclick="toggleChk(\''+f.id+'\','+i+')"><span style="flex:1'+(x.done?';text-decoration:line-through;color:#9ca3af':'')+'">'+esc(x.text)+'</span><button class="btn xs red" onclick="delChk(\''+f.id+'\','+i+')">✕</button></div>'; }).join('');
      return '<div class="card fest'+(past?' past':'')+'">'+
        '<div class="row" style="justify-content:space-between"><div><b style="font-size:15px;color:var(--navy)">'+esc(f.name)+'</b> '+statusBadge(f)+(f.blackout?' <span class="badge free">Leave freeze</span>':'')+'<div class="muted">'+esc(f.start)+' → '+esc(f.end)+'</div></div>'+
          '<div class="row"><button class="btn xs" onclick="editFestival(\''+f.id+'\')">Edit</button><button class="btn xs red" onclick="delFestival(\''+f.id+'\')">Delete</button></div></div>'+
        (f.note?'<div class="muted" style="margin-top:4px">'+esc(f.note)+'</div>':'')+
        '<div class="kpi"><div><b>'+inr(tgt)+'</b><span>Target (TW '+inr((f.targets&&f.targets.titanworld)||0)+' · HE '+inr((f.targets&&f.targets.helios)||0)+')</span></div>'+
          '<div><b>'+inr(act)+'</b><span>Actual (QMS sales)</span></div>'+
          '<div><b>'+pct+'%</b><span>of target</span></div></div>'+
        (tgt>0?'<div class="bar"><span style="width:'+pct+'%"></span></div>':'')+
        '<div style="margin-top:12px"><label>Pre-festival checklist ('+done+'/'+chk.length+')</label>'+chkHtml+
          '<div class="row" style="margin-top:8px"><input id="ck_'+f.id+'" placeholder="Add a prep item — e.g. top up Raga stock" style="flex:1"><button class="btn xs g" onclick="addChkItem(\''+f.id+'\')">Add</button></div></div>'+
      '</div>';
    }).join('');
  }
  render();
</script>

)tick();else document.addEventListener('DOMContentLoaded',tick);[400,1200].forEach(function(d){setTimeout(tick,d);});window.addEventListener('resize',sch);try{new MutationObserver(sch).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']});}catch(e){}})();</script>
